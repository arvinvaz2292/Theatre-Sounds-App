// Helper: get a DOM child by data-role inside the track element
function role(t,name){ return t.el?.querySelector(`[data-role="${name}"]`); }

// Update all display fields from current state. Doesn't touch WaveSurfer.
function refreshTrackDisplay(t){
  if(!t.el) return;
  // Name
  const nc=role(t,'name-c'); if(nc) nc.textContent=t.name;
  const ne=role(t,'name-e'); if(ne) ne.textContent=t.name;
  // Category
  const cc=role(t,'cat-c'); if(cc){ cc.textContent=t.cat; cc.className=`tc-cat ${t.cat}`; }
  const ce=role(t,'cat-e'); if(ce){ ce.textContent=t.cat; ce.className=`exp-cat ${t.cat}`; }
  // Filename
  const fn=role(t,'filename-e'); if(fn){ fn.textContent=t.filename||'No file loaded'; }
  const ufn=role(t,'upload-fn'); if(ufn){
    if(t.filename && !t.src){
      ufn.innerHTML=`<span style="color:var(--amber)">⚠ Missing: ${esc(t.filename)} — click to upload</span>`;
    } else {
      ufn.textContent=t.filename||'Upload audio file…';
    }
  }
  // Mark track as missing audio in the UI
  if(t.el) t.el.classList.toggle('missing-audio', !!(t.filename && !t.src));
  // Volume
  const vc=role(t,'vol-c'); if(vc) vc.value=t.volume;
  const ve=role(t,'vol-e'); if(ve) ve.value=t.volume;
  const vpc=role(t,'volpct-c'); if(vpc) vpc.textContent=Math.round(t.volume*100)+'%';
  const vpe=role(t,'volpct-e'); if(vpe) vpe.textContent=Math.round(t.volume*100)+'%';
  // Playing state
  refreshPlayUI(t);
  // Speed
  const sv=role(t,'spd-val'); if(sv) sv.textContent=t.speed.toFixed(2)+'x';
  const sl=role(t,'spd-lbl'); if(sl) sl.textContent=t.speed.toFixed(2)+'x';
  // Loop
  refreshLoopUI(t);
  // Cues
  refreshCueList(t);
  // Cat popup contents
  rebuildCatPopup(t);
  // Accent
  t.el.style.setProperty('--accent',t.accent);
  // Group badge
  refreshTrackGroupBadge(t);
  // BGM tracks have no loop/cue — hide that whole area
  t.el.classList.toggle('is-bgm', t.cat==='BGM');
}

function refreshPlayUI(t){
  if(!t.el) return;
  t.el.classList.toggle('is-playing',t.playing);
  const pc=role(t,'play-c'); if(pc){ pc.textContent=t.playing?'⏸':'▶'; pc.classList.toggle('on',t.playing); }
  const pe=role(t,'play-e'); if(pe){ pe.textContent=t.playing?'⏸  PAUSE':'▶  PLAY'; pe.classList.toggle('is-playing',t.playing); }
  // Cascade to group bar if this track belongs to one
  const g=groupOfTrack(t); if(g) refreshGroupDisplay(g);
}

// Show/hide the + ADD TO SCENE and − REMOVE FROM SCENE buttons based on scene state
function refreshSceneButtons(t){
  if(!t.el) return;
  const sceneActive = !!activeSceneId;
  const inScene = isInActiveScene(t);
  // Collapsed view: show + button only if scene active AND track not in scene
  const addC=role(t,'addscene-c');
  if(addC) addC.style.display = (sceneActive && !inScene) ? 'flex' : 'none';
  // Expanded view: show − if in scene, + if not in scene (only when scene active)
  const addE=role(t,'addscene-e');
  if(addE) addE.style.display = (sceneActive && !inScene) ? 'flex' : 'none';
  const rmE=role(t,'rmscene-e');
  if(rmE) rmE.style.display = (sceneActive && inScene) ? 'flex' : 'none';
  // Also mark the track when it's staged (in scene but not playing) for visual cue
  t.el.classList.toggle('staged', sceneActive && inScene && !t.playing);
}

function refreshLoopUI(t){
  const ls=role(t,'loop-state'); if(ls) ls.textContent=t.loopEnabled?'ON':'OFF';
  const lt=role(t,'loop-tog'); if(lt) lt.checked=t.loopEnabled;
  const lc=role(t,'loop-cnt'); if(lc) lc.value=t.loopCount;
  const li=role(t,'loop-in'); if(li) li.textContent=t.loopStart!==null?fmtT(t.loopStart):'--:--';
  const lo=role(t,'loop-out'); if(lo) lo.textContent=t.loopEnd!==null?fmtT(t.loopEnd):'--:--';
  const ll=role(t,'loop-len'); if(ll) ll.textContent=(t.loopStart!==null&&t.loopEnd!==null)?fmtT(t.loopEnd-t.loopStart):'--:--';
  // Dropdown summary line
  const sum=role(t,'loop-summary');
  if(sum){
    if(t.loopEnabled && t.loopStart!==null && t.loopEnd!==null){
      sum.textContent=`On · ${fmtT(t.loopStart)}–${fmtT(t.loopEnd)}${t.loopCount>0?` ×${t.loopCount}`:' ∞'}`;
      sum.classList.add('active');
    } else if(t.loopStart!==null && t.loopEnd!==null){
      sum.textContent=`Region set (off)`;
      sum.classList.remove('active');
    } else {
      sum.textContent='Off';
      sum.classList.remove('active');
    }
  }
}

// Expand/collapse the loop dropdown inside a track
function toggleLoopDropdown(id){
  const t=tById(id); if(!t?.el) return;
  const dd=role(t,'loop-dropdown');
  const caret=role(t,'loop-caret');
  if(!dd) return;
  const open=dd.classList.toggle('open');
  if(caret) caret.textContent=open?'▾':'▸';
}

function refreshCueList(t){
  const cl=role(t,'cuelist'); if(!cl) return;
  if(!t.cues.length){ cl.innerHTML='<span class="exp-cue-empty">No cues set</span>'; return; }
  cl.innerHTML=t.cues.map(c=>`
    <div class="exp-cue-chip">
      <button class="exp-cue-jump" onclick="jumpCue(${t.id},'${c.id}')">
        <span class="exp-cue-lbl">${esc(c.label)}</span>
        <span class="exp-cue-t">${fmtT(c.time)}</span>
      </button>
      <button class="exp-cue-rm" onclick="rmCue(${t.id},'${c.id}')">✕</button>
    </div>`).join('');
}

function rebuildCatPopup(t){
  const pop=role(t,'catpop'); if(!pop) return;
  pop.innerHTML=CAT_ORDER.filter(c=>c!==t.cat).map(c=>`<button onclick="setCat(${t.id},'${c}')">${c}</button>`).join('');
}

// ════════════════════════════════════════════════
// LAYOUT — moves track elements between containers
// without destroying them (preserves WaveSurfer)
// ════════════════════════════════════════════════
function isTrackExpanded(t){
  // A track is expanded if:
  //  - it is currently playing (always)
  //  - it is INCLUDED in the active scene (whether staged or auto-fire)
  //  - the user manually expanded it
  const activeScene=scenes.find(s=>s.id===activeSceneId);
  const sceneIncludedIds = activeScene
    ? new Set(activeScene.snapshot.filter(sn=>sn.included || sn.playing).map(sn=>sn.id))
    : new Set();
  return t.playing || sceneIncludedIds.has(t.id) || expandedIds.has(t.id);
}

// Check if a track is in the active scene at all
function isInActiveScene(t){
  const s=scenes.find(s=>s.id===activeSceneId); if(!s) return false;
  const sn=s.snapshot.find(x=>x.id===t.id);
  return !!(sn && (sn.included || sn.playing));
}

function layoutTracks(){
  const activePool=document.getElementById('active-pool');
  const inactivePool=document.getElementById('inactive-pool');
  const sorted=[...tracks].sort((a,b)=>a.order-b.order);
  let activeCount=0, inactiveCount=0;

  const inactiveByCat={BGM:[],SFX:[],AMB:[]};
  const activeByCat={BGM:[],SFX:[],AMB:[]};

  sorted.forEach(t=>{
    if(!t.el) buildTrackElement(t);
    const expand=isTrackExpanded(t);
    t.el.classList.toggle('is-expanded',expand);
    refreshSceneButtons(t);
    if(expand){
      activeCount++;
      activeByCat[t.cat].push(t);
      if(!t.ws && t.src) initWS(t);
    } else {
      inactiveByCat[t.cat].push(t);
      inactiveCount++;
    }
  });

  // Rebuild active pool grouped by category (BGM → SFX → AMB)
  activePool.querySelectorAll('.active-cat-divider').forEach(d=>d.remove());
  CAT_ORDER.forEach(cat=>{
    const items=activeByCat[cat];
    if(!items.length) return;
    const div=document.createElement('div');
    div.className=`active-cat-divider ${cat}`;
    div.innerHTML=`<span>${cat}</span>`;
    activePool.appendChild(div);
    items.forEach(t=>activePool.appendChild(t.el)); // MOVES existing element
  });

  // Rebuild inactive pool with group bars first, then category dividers + tracks
  // Remove all dividers and group bars (cheap)
  inactivePool.querySelectorAll('.cat-divider, .grp-section').forEach(d=>d.remove());

  // Group section: list all groups with their bars at the top of the inactive pool
  if(groups.length){
    const grpSec=document.createElement('div');
    grpSec.className='grp-section';
    const lbl=document.createElement('div');
    lbl.className='grp-section-label';
    lbl.innerHTML=`<span>GROUPS</span> <span style="color:var(--muted);font-size:9px;letter-spacing:1px;font-weight:400">Stems / busses</span>`;
    grpSec.appendChild(lbl);
    groups.forEach(g=>{
      if(!g.el) buildGroupElement(g);
      grpSec.appendChild(g.el);
      refreshGroupDisplay(g);
    });
    inactivePool.appendChild(grpSec);
  }

  // Walk through cats and append divider + tracks
  CAT_ORDER.forEach(cat=>{
    const items=inactiveByCat[cat];
    if(!items.length) return;
    const div=document.createElement('div');
    div.className=`cat-divider ${cat}`;
    div.innerHTML=`<span>${cat}</span> <span style="color:var(--muted);font-size:9px;letter-spacing:1px;font-weight:400">${CAT_DESC[cat]}</span>`;
    inactivePool.appendChild(div);
    items.forEach(t=>{
      // Destroy WS for inactive tracks to free memory (only if not playing)
      if(t.ws && !t.playing){ t.ws.destroy(); t.ws=null; t.region=null; t._rp=null; }
      inactivePool.appendChild(t.el); // MOVE element here
    });
  });

  // Update header counts/visibility
  document.getElementById('active-pool-header').style.display=activeCount>0?'flex':'none';
  document.getElementById('active-pool-count').textContent=activeCount;
  document.getElementById('inactive-pool-count').textContent=inactiveCount;
  document.getElementById('inactive-pool-header').style.display=inactiveCount>0?'flex':'none';
  document.getElementById('empty-msg').style.display=tracks.length===0?'block':'none';

  updateStatus();
}

function expandTrack(id){
  const t=tById(id); if(!t) return;
  expandedIds.add(id);
  layoutTracks();
  if(!t.ws && t.src) initWS(t);
}
function collapseTrack(id){
  expandedIds.delete(id);
  layoutTracks();
}

// ════════════════════════════════════════════════
// CATEGORY POPUP
// ════════════════════════════════════════════════
function toggleCatPop(id,event){
  if(event) event.stopPropagation();
  const t=tById(id); if(!t) return;
  // Close any other popups first
  document.querySelectorAll('.cat-popup.open').forEach(p=>p.classList.remove('open'));
  // Only popup if track is expanded (collapsed cat badge clicks expand+show popup)
  if(!isTrackExpanded(t)){
    expandedIds.add(id);
    layoutTracks();
    setTimeout(()=>{ const pop=role(t,'catpop'); if(pop) pop.classList.add('open'); },50);
  } else {
    const pop=role(t,'catpop'); if(pop) pop.classList.add('open');
  }
}
function setCat(id,cat){
  const t=tById(id); if(!t) return;
  t.cat=cat;
  const idx=catC[cat]++%CAT_ACCENTS[cat].length;
  t.accent=CAT_ACCENTS[cat][idx];
  refreshTrackDisplay(t);
  document.querySelectorAll('.cat-popup.open').forEach(p=>p.classList.remove('open'));
  layoutTracks();
  autoSave();
}

// ════════════════════════════════════════════════
// WAVESURFER
// ════════════════════════════════════════════════
function initWS(t){
  if(t.ws) return; // already alive
  const waveContainer=role(t,'wave');
  if(!waveContainer || !t.src) return;
  let rp; try{ rp=WaveSurfer.RegionsPlugin.create(); }catch(e){}
  const opts={container:waveContainer,waveColor:'#1c2830',progressColor:t.accent,cursorColor:'rgba(255,255,255,.5)',cursorWidth:1,height:74,barWidth:2,barGap:1,barRadius:2,normalize:true,interact:true};
  if(rp) opts.plugins=[rp];
  const ws=WaveSurfer.create(opts);
  t.ws=ws; t._rp=rp||null;
  ws.load(t.src);
  ws.on('ready',()=>{
    t._audioVol=t.volume; // actual audio level starts at target
    ws.setPlaybackRate(t.speed);
    ws.setVolume(effectiveVol(t));
    const tdur=role(t,'tdur'); if(tdur) tdur.textContent=fmtT(ws.getDuration());
    if(rp && t.loopStart!==null && t.loopEnd!==null) mkRegion(t);
  });
  ws.on('timeupdate',cur=>{
    const tcur=role(t,'tcur'); if(tcur) tcur.textContent=fmtT(cur);
    if(!seekDragging[t.id]){
      const dur=ws.getDuration()||1;
      const sk=role(t,'seek-e'); if(sk) sk.value=(cur/dur)*1000;
    }
  });
  ws.on('seek',()=>{
    const cur=ws.getCurrentTime(),dur=ws.getDuration()||1;
    const sk=role(t,'seek-e'); if(sk) sk.value=(cur/dur)*1000;
    const tcur=role(t,'tcur'); if(tcur) tcur.textContent=fmtT(cur);
  });
  ws.on('play',()=>{ t.playing=true; refreshPlayUI(t); updateStatus(); startAutoStop(t); });
  ws.on('pause',()=>{ t.playing=false; refreshPlayUI(t); updateStatus(); });
  ws.on('finish',()=>{ t.playing=false; refreshPlayUI(t); updateStatus(); });
  if(rp){
    rp.on('region-updated',r=>{ t.loopStart=r.start; t.loopEnd=r.end; refreshLoopUI(t); autoSave(); });
    rp.on('region-created',r=>{ rp.getRegions().forEach(x=>{ if(x.id!==r.id) x.remove(); }); t.region=r; t.loopStart=r.start; t.loopEnd=r.end; refreshLoopUI(t); autoSave(); });
  }
}

function mkRegion(t){
  const rp=t._rp; if(!rp||!t.ws) return;
  rp.getRegions().forEach(r=>r.remove());
  const dur=t.ws.getDuration();
  t.region=rp.addRegion({start:Math.max(0,t.loopStart),end:Math.min(dur,t.loopEnd),color:'rgba(255,193,7,.15)',drag:true,resize:true});
}

// ════════════════════════════════════════════════
// LOOP TICKER
// ════════════════════════════════════════════════
setInterval(()=>{
  tracks.forEach(t=>{
    if(!t.playing||!t.loopEnabled||t.loopStart===null||t.loopEnd===null||!t.ws) return;
    const cur=t.ws.getCurrentTime();
    if(cur>=t.loopEnd){
      if(t.loopCount>0){
        t.loopPlays++;
        if(t.loopPlays>=t.loopCount){ t.loopPlays=0; t.ws.pause(); return; }
      }
      t.ws.seekTo(t.loopStart/(t.ws.getDuration()||1));
    }
  });
},80);

function setLoopPt(id,which){
  const t=tById(id); if(!t?.ws) return;
  const cur=t.ws.getCurrentTime(),dur=t.ws.getDuration();
  if(!dur){alert('Load audio first.');return;}
  if(which==='start'){ t.loopStart=cur; if(t.loopEnd!==null&&t.loopEnd<=t.loopStart) t.loopEnd=null; }
  else{ t.loopEnd=cur; if(t.loopStart!==null&&t.loopStart>=t.loopEnd) t.loopStart=null; }
  if(t.loopStart!==null&&t.loopEnd!==null) mkRegion(t);
  refreshLoopUI(t); autoSave();
}
function clearLoop(id){
  const t=tById(id); if(!t) return;
  t.loopStart=null; t.loopEnd=null; t.loopPlays=0;
  if(t._rp) t._rp.getRegions().forEach(r=>r.remove());
  t.region=null; refreshLoopUI(t); autoSave();
}
function jumpLoop(id,which){
  const t=tById(id); if(!t?.ws) return;
  const dur=t.ws.getDuration()||1;
  if(which==='start'&&t.loopStart!==null) t.ws.seekTo(t.loopStart/dur);
  else if(which==='end'&&t.loopEnd!==null) t.ws.seekTo(Math.max(0,t.loopEnd-2)/dur);
}
function toggleLoop(id,state){
  const t=tById(id); if(!t) return;
  t.loopEnabled=state; t.loopPlays=0;
  refreshLoopUI(t); autoSave();
}

// ════════════════════════════════════════════════
// CUES
// ════════════════════════════════════════════════
function addCue(id){
  const t=tById(id);
  if(!t?.ws||!t.ws.getDuration()){alert('Load audio first.');return;}
  const time=t.ws.getCurrentTime();
  const label=prompt(`Cue name (at ${fmtT(time)}):`,`Cue ${t.cues.length+1}`);
  if(label===null) return;
  t.cues.push({id:'c'+Date.now(),label:label||`Cue ${t.cues.length+1}`,time});
  t.cues.sort((a,b)=>a.time-b.time);
  refreshCueList(t); autoSave();
}
function rmCue(tid,cid){
  const t=tById(tid); if(!t) return;
  t.cues=t.cues.filter(c=>c.id!==cid);
  refreshCueList(t); autoSave();
}
function jumpCue(tid,cid){
  const t=tById(tid); if(!t?.ws) return;
  const c=t.cues.find(c=>c.id===cid);
  if(c) t.ws.seekTo(c.time/(t.ws.getDuration()||1));
}

// ════════════════════════════════════════════════
// TRACK ACTIONS
// ════════════════════════════════════════════════
function addTrack(name='New Track',cat='AMB'){
  const t=mkTrack(name,cat);
  tracks.push(t);
  buildTrackElement(t);
  expandedIds.add(t.id);
  layoutTracks();
  autoSave();
}

function deleteTrack(id){
  const t=tById(id); if(!t) return;
  clearAutoStop(t);
  if(t.ws) t.ws.destroy();
  if(t.src) URL.revokeObjectURL(t.src);
  if(t.el) t.el.remove();
  // Remove from any group
  groups.forEach(g=>{
    const idx=g.trackIds.indexOf(id);
    if(idx>=0){ g.trackIds.splice(idx,1); refreshGroupDisplay(g); }
  });
  tracks=tracks.filter(t=>t.id!==id);
  expandedIds.delete(id);
  layoutTracks();
  autoSave();
}

async function togglePlay(id){
  const t=tById(id); if(!t) return;
  if(!t.src){ showToast('Upload an audio file first'); return; }
  if(!t.ws){
    // Make sure track is expanded so WaveSurfer container exists
    if(!isTrackExpanded(t)){
      expandedIds.add(id);
      layoutTracks();
    }
    initWS(t);
    // Wait for WS to be ready
    await new Promise(res=>{
      const tk=tById(id);
      if(tk?.ws?.getDuration()) return res();
      const handler=()=>res();
      tk.ws.once('ready',handler);
      setTimeout(res,3500);
    });
  }
  if(t.ws) await t.ws.playPause();
}

function stopTrack(id){
  const t=tById(id); if(!t) return;
  clearAutoStop(t); clearInterval(t.fadeTimer);
  if(t.ws) t.ws.stop();
  t.playing=false; t.loopPlays=0;
  refreshPlayUI(t); updateStatus();
}

// ════════════════════════════════════════════════
// FADE ALL
// ════════════════════════════════════════════════
let stopAllTimer=null;
function resetStopBtn(){
  const btn=document.getElementById('stopall-btn');
  const lbl=document.getElementById('stopall-lbl');
  const prog=document.getElementById('stopall-progress');
  if(btn) btn.classList.remove('fading');
  if(lbl) lbl.textContent='↓ FADE ALL';
  if(prog){ prog.style.transition='none'; prog.style.width='0'; }
}
function hardStopAll(){
  if(stopAllTimer!==null){ clearInterval(stopAllTimer); stopAllTimer=null; }
  tracks.forEach(t=>{
    clearAutoStop(t);
    if(t.ws){ t.ws.stop(); t.ws.setVolume(effectiveVol(t)); }
    t.playing=false; refreshPlayUI(t);
  });
  updateStatus(); resetStopBtn();
}

// Fade out a filtered set of tracks. cat=null fades everything; cat='SFX' etc fades that category.
function stopAllFade(){
  if(stopAllTimer!==null){ hardStopAll(); return; }
  const FADE=2000;
  const playing=tracks.filter(t=>t.playing&&t.ws);
  if(!playing.length) return;
  const startLevels={};
  playing.forEach(t=>{ startLevels[t.id] = masterVol>0 ? t.ws.getVolume()/masterVol : 0; });
  playing.forEach(t=>clearInterval(t.fadeTimer));
  const btn=document.getElementById('stopall-btn');
  const lbl=document.getElementById('stopall-lbl');
  const prog=document.getElementById('stopall-progress');
  if(btn) btn.classList.add('fading');
  if(lbl) lbl.textContent='■ HARD STOP';
  if(prog){
    prog.style.transition='none'; prog.style.width='0';
    requestAnimationFrame(()=>{ prog.style.transition=`width ${FADE}ms linear`; prog.style.width='100%'; });
  }
  const t0=Date.now();
  stopAllTimer=setInterval(()=>{
    const r=Math.min((Date.now()-t0)/FADE,1);
    playing.forEach(t=>{
      if(!t.ws) return;
      t.ws.setVolume(startLevels[t.id]*(1-r)*masterVol);
    });
    if(r>=1){
      clearInterval(stopAllTimer); stopAllTimer=null;
      playing.forEach(t=>{
        clearAutoStop(t);
        if(t.ws){ t.ws.pause(); t.ws.setVolume(effectiveVol(t)); }
        t.playing=false; refreshPlayUI(t);
      });
      updateStatus(); resetStopBtn();
    }
  },30);
}

// ════════════════════════════════════════════════
// VOLUME / FADE / SEEK / SPEED
// ════════════════════════════════════════════════
// Volume slider sets a TARGET; the audio eases toward it for a smooth fade feel.
// t.volume = the slider/target value. t._audioVol = the actual current audio level.
function onVol(id,v){
  const t=tById(id); if(!t) return;
  t.volume=parseFloat(v);
  // Update displays immediately (the number reflects the target)
  const vc=role(t,'vol-c'); if(vc && vc.value!=v) vc.value=v;
  const ve=role(t,'vol-e'); if(ve && ve.value!=v) ve.value=v;
  const vpc=role(t,'volpct-c'); if(vpc) vpc.textContent=Math.round(t.volume*100)+'%';
  const vpe=role(t,'volpct-e'); if(vpe) vpe.textContent=Math.round(t.volume*100)+'%';
  // Ease audio toward target
  startVolEase(t);
  autoSave();
}

// Smoothly ease a track's audio volume toward its target (t.volume)
function startVolEase(t){
  if(!t.ws) return;
  clearInterval(t.fadeTimer);
  const GLIDE_MS=400; // quick glide so slider feels like a smooth fade, not a jump
  if(t._audioVol===undefined) t._audioVol = masterVol>0 ? t.ws.getVolume()/(masterVol*(catVol[t.cat]??1)*((groupOfTrack(t)?.volume)??1)) : t.volume;
  const startLevel=t._audioVol;
  const target=t.volume;
  if(Math.abs(startLevel-target)<0.005){
    t._audioVol=target; t.ws.setVolume(effectiveVol(t)); return;
  }
  const t0=Date.now();
  t.fadeTimer=setInterval(()=>{
    const r=Math.min((Date.now()-t0)/GLIDE_MS,1);
    t._audioVol=startLevel+(target-startLevel)*r;
    // apply with all multipliers
    const g=groupOfTrack(t);
    t.ws.setVolume(t._audioVol * (g?g.volume:1) * (catVol[t.cat]??1) * masterVol);
    if(r>=1){ clearInterval(t.fadeTimer); t._audioVol=target; t.ws.setVolume(effectiveVol(t)); }
  },20);
}

// Immediate fine nudge (no fade) — for the up/down precision buttons
function nudgeVol(id,delta){
  const t=tById(id); if(!t) return;
  clearInterval(t.fadeTimer);
  t.volume=Math.max(0,Math.min(1, t.volume+delta));
  t._audioVol=t.volume;
  if(t.ws) t.ws.setVolume(effectiveVol(t));
  syncVolUI(t);
  autoSave();
}

function syncVolUI(t){
  const vc=role(t,'vol-c'); if(vc) vc.value=t.volume;
  const ve=role(t,'vol-e'); if(ve) ve.value=t.volume;
  const vpc=role(t,'volpct-c'); if(vpc) vpc.textContent=Math.round(t.volume*100)+'%';
  const vpe=role(t,'volpct-e'); if(vpe) vpe.textContent=Math.round(t.volume*100)+'%';
}
function doFade(id,dir){
  const t=tById(id); if(!t?.ws) return;
  clearInterval(t.fadeTimer);
  const FADE_MS = 2000; // constant 2-second fade regardless of starting volume

  if(dir==='in'){
    // Target = current slider value. If the slider is at 0, set slider to 100% and fade up to there.
    let target=t.volume;
    if(target<=0.01){
      target=1;
      t.volume=1;
      syncVolUI(t);
    }
    const startLevel = (t._audioVol!==undefined)?t._audioVol:0;
    if(startLevel>=target){ t._audioVol=target; t.ws.setVolume(effectiveVol(t)); return; }
    const t0=Date.now();
    t.fadeTimer=setInterval(()=>{
      const r=Math.min((Date.now()-t0)/FADE_MS,1);
      t._audioVol=startLevel+(target-startLevel)*r;
      const g=groupOfTrack(t);
      t.ws.setVolume(t._audioVol*(g?g.volume:1)*(catVol[t.cat]??1)*masterVol);
      if(r>=1){
        clearInterval(t.fadeTimer);
        t._audioVol=target;
        t.ws.setVolume(effectiveVol(t));
        syncVolUI(t);
      }
    },30);

  } else { // 'out'
    const startLevel = (t._audioVol!==undefined)?t._audioVol:(masterVol>0?t.ws.getVolume()/masterVol:0);
    if(startLevel<=0){ t.ws.setVolume(0); t._audioVol=0; return; }
    const t0=Date.now();
    t.fadeTimer=setInterval(()=>{
      const r=Math.min((Date.now()-t0)/FADE_MS,1);
      t._audioVol=startLevel*(1-r);
      const g=groupOfTrack(t);
      t.ws.setVolume(t._audioVol*(g?g.volume:1)*(catVol[t.cat]??1)*masterVol);
      if(r>=1){
        clearInterval(t.fadeTimer);
        t._audioVol=0;
        t.ws.setVolume(0);
      }
    },30);
  }
}
function killVol(id){
  const t=tById(id); if(!t?.ws) return;
  clearInterval(t.fadeTimer);
  t.volume=0; t._audioVol=0; t.ws.setVolume(0); syncVolUI(t); autoSave();
}
function onSeek(id,val){
  const t=tById(id); if(!t?.ws) return;
  t.ws.seekTo(val/1000);
}
function setSpeed(id,val,sliderEl){
  const t=tById(id); if(!t) return;
  t.speed=parseFloat(val);
  if(t.ws) t.ws.setPlaybackRate(t.speed);
  const sv=role(t,'spd-val'); if(sv) sv.textContent=t.speed.toFixed(2)+'x';
  const sl=role(t,'spd-lbl'); if(sl) sl.textContent=t.speed.toFixed(2)+'x';
  if(!sliderEl){
    const inp=t.el?.querySelector('.exp-speed-popup input[type=range]');
    if(inp) inp.value=t.speed;
  }
  autoSave();
}
function toggleSpeedPop(id){
  const t=tById(id); if(!t) return;
  const wrap=role(t,'spd-wrap'); if(!wrap) return;
  const was=wrap.classList.contains('open');
  document.querySelectorAll('.exp-speed.open').forEach(e=>e.classList.remove('open'));
  if(!was) wrap.classList.add('open');
}

// ════════════════════════════════════════════════
function startAutoStop(t){
  clearAutoStop(t);
  if(t.autoStop>0) t.autoStopTimer=setTimeout(()=>{ if(t.ws) t.ws.pause(); }, t.autoStop*1000);
}
function clearAutoStop(t){ if(t.autoStopTimer){ clearTimeout(t.autoStopTimer); t.autoStopTimer=null; } }

// RENAME

function renameStart(id){
  const t=tById(id); if(!t) return;
  // Use the expanded name field if expanded, otherwise collapsed
  const el=isTrackExpanded(t) ? role(t,'name-e') : role(t,'name-c');
  if(!el) return;
  const orig=t.name;
  const inp=document.createElement('input');
  inp.className=isTrackExpanded(t)?'exp-name-input':'scene-name-input';
  inp.style.width='100%';
  inp.value=t.name;
  el.replaceWith(inp);
  inp.focus(); inp.select();
  const commit=()=>{
    t.name=inp.value.trim()||orig;
    refreshTrackDisplay(t); // rebuilds name elements
    autoSave();
  };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter') inp.blur();
    if(e.key==='Escape'){ inp.value=orig; inp.blur(); }
  });
}

function updateStatus(){
  const playing=tracks.filter(t=>t.playing).length;
  document.getElementById('live-dot').className='live-dot'+(playing>0?' on':'');
  document.getElementById('st-playing').textContent=playing+' PLAYING';
  document.getElementById('st-tracks').textContent=tracks.length;
}

// ════════════════════════════════════════════════
// SCENES
// ════════════════════════════════════════════════
function mkSnapshot(){
  // included = track is part of this scene (will show in Now Playing when scene is fired)
  // playing  = track auto-fires when scene fires (vs just being staged silently)
  return tracks.map(t=>({id:t.id,name:t.name,cat:t.cat,volume:t.volume,speed:t.speed,playing:t.playing,included:t.playing,loopEnabled:t.loopEnabled,loopStart:t.loopStart,loopEnd:t.loopEnd,loopCount:t.loopCount,cues:JSON.parse(JSON.stringify(t.cues))}));
}

// Add a track to the currently-active scene (staged, doesn't auto-fire)
function addToScene(trackId){
  const s=scenes.find(s=>s.id===activeSceneId);
  if(!s){ showToast('Fire a scene first'); return; }
  const t=tById(trackId); if(!t) return;
  let sn=s.snapshot.find(x=>x.id===trackId);
  if(sn){
    sn.included=true; // ensure included; leave playing state alone
  } else {
    s.snapshot.push({id:t.id,name:t.name,cat:t.cat,volume:t.volume,speed:t.speed,playing:false,included:true,loopEnabled:t.loopEnabled,loopStart:t.loopStart,loopEnd:t.loopEnd,loopCount:t.loopCount,cues:JSON.parse(JSON.stringify(t.cues))});
  }
  showToast(`Added "${t.name}" to scene`);
  layoutTracks();
  renderScenes();
  autoSave();
}

// Remove a track from the currently-active scene (stops it if playing)
function removeFromScene(trackId){
  const s=scenes.find(s=>s.id===activeSceneId);
  if(!s) return;
  const t=tById(trackId); if(!t) return;
  s.snapshot=s.snapshot.filter(x=>x.id!==trackId);
  // If it's currently playing, stop it
  if(t.playing){ stopTrack(trackId); }
  expandedIds.delete(trackId);
  showToast(`Removed "${t.name}" from scene`);
  layoutTracks();
  renderScenes();
  autoSave();
}

function saveScene(){
  const name=prompt('Scene name:',`Scene ${scenes.length+1}`);
  if(!name) return;
  scenes.push({id:'s'+Date.now(),name,notes:'',snapshot:mkSnapshot(),fadeDur:2});
  renderScenes(); autoSave();
}

function updateScene(sid){
  const s=scenes.find(s=>s.id===sid); if(!s) return;
  // Preserve which tracks were previously included in this scene
  const prevIncluded={};
  s.snapshot.forEach(sn=>{ prevIncluded[sn.id]=sn.included; });
  // Rebuild snapshot — keep tracks that were included before, plus any currently playing
  s.snapshot=tracks
    .filter(t=>prevIncluded[t.id]||t.playing)
    .map(t=>({id:t.id,name:t.name,cat:t.cat,volume:t.volume,speed:t.speed,playing:t.playing,included:true,loopEnabled:t.loopEnabled,loopStart:t.loopStart,loopEnd:t.loopEnd,loopCount:t.loopCount,cues:JSON.parse(JSON.stringify(t.cues))}));
  // Visual confirmation
  const card=document.getElementById(`sc-${sid}`);
  if(card){
    const btn=card.querySelector('.sa-btn.update');
    if(btn){
      const orig=btn.textContent;
      btn.textContent='✓ SAVED'; btn.style.color='var(--green)';
      setTimeout(()=>{ btn.textContent=orig; btn.style.color=''; },1400);
    }
    const prev=card.querySelector('.scene-preview');
    if(prev) prev.innerHTML=buildPreviewHTML(s);
  }
  autoSave();
}

function deleteScene(sid){
  scenes=scenes.filter(s=>s.id!==sid);
  if(activeSceneId===sid) activeSceneId=null;
  renderScenes(); updateNotesBanner(); layoutTracks(); autoSave();
}

function moveScene(sid,dir){
  const i=scenes.findIndex(s=>s.id===sid); if(i<0) return;
  const j=i+dir; if(j<0||j>=scenes.length) return;
  [scenes[i],scenes[j]]=[scenes[j],scenes[i]];
  renderScenes(); autoSave();
}

function duplicateScene(sid){
  const s=scenes.find(s=>s.id===sid); if(!s) return;
  const copy={
    id:'s'+Date.now(),
    name:s.name+' (copy)',
    notes:s.notes||'',
    fadeDur:s.fadeDur,
    snapshot:JSON.parse(JSON.stringify(s.snapshot)),
  };
  const i=scenes.findIndex(x=>x.id===sid);
  scenes.splice(i+1,0,copy); // insert right after original
  renderScenes(); autoSave();
  showToast(`Duplicated "${s.name}"`);
}

function renameScene(sid){
  const s=scenes.find(s=>s.id===sid); if(!s) return;
  const el=document.querySelector(`#sc-${sid} .scene-name`); if(!el) return;
  const orig=s.name;
  const inp=document.createElement('input');
  inp.className='scene-name-input';
  inp.value=s.name;
  el.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{
    s.name=inp.value.trim()||orig;
    const d=document.createElement('div');
    d.className='scene-name';
    d.textContent=s.name;
    d.ondblclick=()=>renameScene(sid);
    if(activeSceneId===sid) d.style.color='var(--green)';
    inp.replaceWith(d); autoSave();
  };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){ inp.value=orig; inp.blur(); } });
}

function fireScene(sid,xfade=false){
  const s=scenes.find(s=>s.id===sid); if(!s) return;
  activeSceneId=sid;
  const fadeDur=(xfade?Math.max(0.5,s.fadeDur):0)*1000;
  const snapMap={}; s.snapshot.forEach(sn=>{ snapMap[sn.id]=sn; });

  // Layout tracks FIRST so the active pool contains the right elements
  // before WaveSurfer tries to init/render in them.
  layoutTracks();
  renderScenes();
  updateNotesBanner();

  tracks.forEach(t=>{
    clearInterval(t.fadeTimer);
    const snap=snapMap[t.id];
    if(!snap){
      if(t.playing && t.ws){
        if(xfade && fadeDur>0){
          const sv=t.ws.getVolume(), t0=Date.now();
          t.fadeTimer=setInterval(()=>{
            const r=Math.min((Date.now()-t0)/fadeDur,1);
            t.ws?.setVolume(sv*(1-r));
            if(r>=1){ clearInterval(t.fadeTimer); t.ws?.pause(); t.playing=false; t.ws?.setVolume(effectiveVol(t)); refreshPlayUI(t); updateStatus(); }
          },30);
        } else { t.ws.pause(); t.playing=false; refreshPlayUI(t); updateStatus(); }
      }
      return;
    }
    const wasPlaying=t.playing, willPlay=snap.playing;
    if(!xfade||fadeDur<=0){ applySnap(t,snap); return; }
    if(wasPlaying && willPlay){
      applySnapMeta(t,snap);
      const sv=t.volume, tv=snap.volume, t0=Date.now();
      t.fadeTimer=setInterval(()=>{
        const r=Math.min((Date.now()-t0)/fadeDur,1);
        const ease=r<.5?2*r*r:(4-2*r)*r-1;
        t.volume=sv+(tv-sv)*ease;
        t.ws?.setVolume(effectiveVol(t)); syncVolUI(t);
        if(r>=1){ clearInterval(t.fadeTimer); t.volume=tv; t.ws?.setVolume(effectiveVol(t)); syncVolUI(t); }
      },30);
    } else if(wasPlaying && !willPlay){
      // If the track is STAGED in the new scene (included but not playing),
      // leave it running — operator may want it to keep going.
      // Only fade-stop if it's not in the new scene at all.
      if(snap.included){
        applySnapMeta(t,snap);
        return;
      }
      const sv=t.ws?.getVolume()??t.volume, t0=Date.now();
      t.fadeTimer=setInterval(()=>{
        const r=Math.min((Date.now()-t0)/fadeDur,1);
        t.ws?.setVolume(sv*(1-r));
        if(r>=1){
          clearInterval(t.fadeTimer);
          t.ws?.pause(); t.playing=false; t.volume=snap.volume;
          t.ws?.setVolume(effectiveVol(t)); syncVolUI(t); refreshPlayUI(t); updateStatus();
          applySnapMeta(t,snap);
        }
      },30);
    } else if(!wasPlaying && willPlay){
      applySnapMeta(t,snap);
      // Ensure track is expanded so WaveSurfer can init
      if(!t.ws) initWS(t);
      const startPlayback=()=>{
        if(!t.ws) return;
        seekToStart(t,snap);
        t.ws.setVolume(0);
        t.ws.play().then(()=>{
          const tv=snap.volume, t0=Date.now();
          t.fadeTimer=setInterval(()=>{
            const r=Math.min((Date.now()-t0)/fadeDur,1);
            t.volume=tv*r;
            t.ws?.setVolume(effectiveVol(t)); syncVolUI(t);
            if(r>=1){ clearInterval(t.fadeTimer); t.volume=tv; syncVolUI(t); }
          },30);
        }).catch(()=>{});
      };
      if(t.ws.getDuration()>0) startPlayback();
      else t.ws.once('ready',startPlayback);
    }
  });

  autoSave();
}

function seekToStart(t,snap){
  if(!t.ws) return;
  const dur=t.ws.getDuration()||1;
  const ls=snap.loopStart??t.loopStart;
  if(snap.loopEnabled && ls!==null) t.ws.seekTo(ls/dur);
  else t.ws.seekTo(0);
}
function applySnap(t,snap){
  t.volume=snap.volume; t.speed=snap.speed; t.loopEnabled=snap.loopEnabled;
  t.loopStart=snap.loopStart; t.loopEnd=snap.loopEnd; t.loopCount=snap.loopCount; t.loopPlays=0;
  if(t.ws){ t.ws.setVolume(effectiveVol(t)); t.ws.setPlaybackRate(t.speed); }
  syncVolUI(t); refreshLoopUI(t);
  if(snap.playing && !t.playing){
    if(!t.ws) initWS(t);
    const start=()=>{ if(t.ws){ seekToStart(t,snap); t.ws.play(); } };
    if(t.ws && t.ws.getDuration()>0) start();
    else if(t.ws) t.ws.once('ready',start);
  }
  // Only stop a playing track if the scene explicitly excludes it (not just staged)
  if(!snap.playing && !snap.included && t.playing && t.ws) t.ws.pause();
}
function applySnapMeta(t,snap){
  t.speed=snap.speed; t.loopEnabled=snap.loopEnabled;
  t.loopStart=snap.loopStart; t.loopEnd=snap.loopEnd; t.loopCount=snap.loopCount; t.loopPlays=0;
  if(t.ws) t.ws.setPlaybackRate(t.speed);
  refreshLoopUI(t);
}

function onSceneNotes(sid,val){
  const s=scenes.find(s=>s.id===sid); if(!s) return;
  s.notes=val;
  if(activeSceneId===sid) updateNotesBanner();
  autoSave();
}

function updateNotesBanner(){
  const s=scenes.find(s=>s.id===activeSceneId);
  const banner=document.getElementById('notes-banner');
  const text=document.getElementById('notes-banner-text');
  if(!banner||!text) return;
  if(s && s.notes && s.notes.trim()){
    text.textContent=s.notes.trim();
    banner.classList.add('visible');
  } else {
    banner.classList.remove('visible');
  }
}

function buildPreviewHTML(s){
  // Show playing tracks first, then staged-only tracks
  const playing = s.snapshot.filter(sn=>sn.playing);
  const staged  = s.snapshot.filter(sn=>!sn.playing && sn.included);
  const ordered = [...playing, ...staged];
  if(!ordered.length) return '<div style="font-size:9px;color:var(--muted);font-style:italic;padding:4px 0">No tracks added yet</div>';
  const shown=ordered.slice(0,4);
  return shown.map(sn=>{
    const isStaged = !sn.playing && sn.included;
    return `<div class="sp-row"><div class="sp-dot${sn.playing?' on':isStaged?' staged':''}"></div><span class="sp-name">${esc(sn.name)}</span><span class="sp-vol">${isStaged?'staged':Math.round(sn.volume*100)+'%'}${sn.loopEnabled?' ⟳':''}</span></div>`;
  }).join('')+(ordered.length>shown.length?`<div class="sp-more">+${ordered.length-shown.length} more tracks</div>`:'');
}

function renderScenes(){
  const list=document.getElementById('scene-list');
  document.getElementById('scene-count').textContent=scenes.length;
  if(!scenes.length){
    list.innerHTML='<div style="font-size:10px;color:var(--muted);padding:16px;text-align:center;font-style:italic">No scenes yet.<br>Set up your tracks then click<br>"Save current state as scene".</div>';
    return;
  }
  list.innerHTML=scenes.map((s,i)=>`
    <div class="scene-card${activeSceneId===s.id?' active':''}" id="sc-${s.id}">
      <div class="scene-card-top">
        <div class="scene-dot"></div>
        <div class="scene-name" ondblclick="renameScene('${s.id}')" title="Double-click to rename">${esc(s.name)}</div>
        <div class="scene-card-icons">
          <button class="scene-icon" onclick="moveScene('${s.id}',-1)" ${i===0?'disabled':''} title="Move up">▲</button>
          <button class="scene-icon" onclick="moveScene('${s.id}',1)" ${i===scenes.length-1?'disabled':''} title="Move down">▼</button>
          <button class="scene-icon" onclick="duplicateScene('${s.id}')" title="Duplicate">⎘</button>
          <button class="scene-icon del" onclick="deleteScene('${s.id}')" title="Delete">✕</button>
        </div>
      </div>
      <div class="scene-preview">${buildPreviewHTML(s)}</div>
      <div class="scene-notes-zone">
        <textarea class="scene-notes" data-sid="${s.id}" rows="2" placeholder="Notes for this scene…" oninput="onSceneNotes('${s.id}',this.value)"></textarea>
      </div>
      <div class="scene-fade-row">XFADE <input type="number" min=".5" max="30" step=".5" value="${s.fadeDur}" oninput="scenes.find(s=>s.id==='${s.id}').fadeDur=parseFloat(this.value)||2;autoSave()"> SEC</div>
      <div class="scene-actions">
        <button class="sa-btn fire" onclick="fireScene('${s.id}',false)">▶ FIRE</button>
        <button class="sa-btn xfade" onclick="fireScene('${s.id}',true)">⇄ XFADE</button>
        <button class="sa-btn update" onclick="updateScene('${s.id}')">↑ UPDATE</button>
      </div>
    </div>`).join('');
  // Set textarea values directly (avoids HTML escaping issues)
  scenes.forEach(s=>{
    const ta=document.querySelector(`textarea[data-sid="${s.id}"]`);
    if(ta) ta.value=s.notes||'';
  });
}

// ════════════════════════════════════════════════
// PERSIST
// ════════════════════════════════════════════════
// Backward-compat: ensure every snapshot entry has an `included` field
function migrateScenes(scenesArr){
  return (scenesArr||[]).map(s=>({
    notes:'',
    ...s,
    snapshot:(s.snapshot||[]).map(sn=>({...sn, included: sn.included ?? sn.playing}))
  }));
}

function stateToJSON(){
  return JSON.stringify({
    version:7,
    tracks:tracks.map(t=>({id:t.id,name:t.name,cat:t.cat,volume:t.volume,speed:t.speed,loopEnabled:t.loopEnabled,loopStart:t.loopStart,loopEnd:t.loopEnd,loopCount:t.loopCount,accent:t.accent,order:t.order,cues:t.cues,autoStop:t.autoStop,filename:t.filename})),
    groups:groups.map(g=>({id:g.id,name:g.name,volume:g.volume,trackIds:g.trackIds})),
    favourites:favourites.map(f=>({id:f.id,name:f.name,filename:f.filename})),
    catVol:{BGM:catVol.BGM,SFX:catVol.SFX,AMB:catVol.AMB},
    scenes,activeSceneId,masterVol,uid,gid,fid,
    expandedIds:[...expandedIds],
  });
}

let _saveTimer=null;
function autoSave(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    try{ localStorage.setItem('offside_v7',stateToJSON()); }catch(e){}
  },800);
}

function exportState(){
  const blob=new Blob([stateToJSON()],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='offside-session.json';
  a.click();
  showToast('Session exported');
}

function deserializeTracks(arr){
  return arr.map(td=>{
    const t=mkTrack(td.name,td.cat||'AMB');
    Object.assign(t,{
      id:td.id, name:td.name, cat:td.cat||'AMB',
      volume:td.volume??1, speed:td.speed||1,
      loopEnabled:td.loopEnabled||false,
      loopStart:td.loopStart??null, loopEnd:td.loopEnd??null,
      loopCount:td.loopCount||0,
      accent:td.accent||t.accent,
      order:td.order||t.order,
      cues:td.cues||[],
      autoStop:td.autoStop||0,
      filename:td.filename||null,
      src:null, ws:null, _rp:null, region:null,
      playing:false, fadeTimer:null, autoStopTimer:null, loopPlays:0,
      el:null,
    });
    return t;
  });
}

function importState(event){
  const f=event.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.tracks) throw new Error('Invalid file');
      tracks.forEach(t=>{ if(t.ws) t.ws.destroy(); if(t.el) t.el.remove(); });
      groups.forEach(g=>{ if(g.el) g.el.remove(); });
      tracks=[]; scenes=[]; groups=[]; expandedIds.clear();
      uid=data.uid||0; gid=data.gid||0; fid=data.fid||0; masterVol=data.masterVol||1; activeSceneId=data.activeSceneId||null;
      tracks=deserializeTracks(data.tracks);
      scenes=migrateScenes(data.scenes);
      groups=(data.groups||[]).map(gd=>({id:gd.id,name:gd.name,volume:gd.volume??1,trackIds:gd.trackIds||[],fadeTimer:null,el:null}));
      favourites=(data.favourites||[]).map(fd=>({id:fd.id,name:fd.name,filename:fd.filename||null,src:null}));
      if(data.catVol){ catVol.BGM=data.catVol.BGM??1; catVol.SFX=data.catVol.SFX??1; catVol.AMB=data.catVol.AMB??1; }
      (data.expandedIds||[]).forEach(id=>expandedIds.add(id));
      tracks.forEach(t=>buildTrackElement(t));
      groups.forEach(g=>buildGroupElement(g));
      const msl=document.getElementById('master-slider'); if(msl) msl.value=masterVol;
      document.getElementById('master-val').textContent=Math.round(masterVol*100)+'%';
      syncCatVolUI();
      renderFavourites();
      layoutTracks(); renderScenes(); updateNotesBanner();
      showToast('Imported! Use ↑ UPLOAD with the same files to restore audio.');
    } catch(err){ alert('Could not import: '+err.message); }
  };
  reader.readAsText(f);
  event.target.value='';
}

function loadAutoSave(){
  try{
    const raw=localStorage.getItem('offside_v7')||localStorage.getItem('offside_v6'); if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data.tracks||!data.tracks.length) return false;
    uid=data.uid||0; gid=data.gid||0; fid=data.fid||0; masterVol=data.masterVol||1; activeSceneId=data.activeSceneId||null;
    tracks=deserializeTracks(data.tracks);
    scenes=migrateScenes(data.scenes);
    groups=(data.groups||[]).map(gd=>({id:gd.id,name:gd.name,volume:gd.volume??1,trackIds:gd.trackIds||[],fadeTimer:null,el:null}));
    favourites=(data.favourites||[]).map(fd=>({id:fd.id,name:fd.name,filename:fd.filename||null,src:null}));
    if(data.catVol){ catVol.BGM=data.catVol.BGM??1; catVol.SFX=data.catVol.SFX??1; catVol.AMB=data.catVol.AMB??1; }
    (data.expandedIds||[]).forEach(id=>expandedIds.add(id));
    tracks.forEach(t=>buildTrackElement(t));
    groups.forEach(g=>buildGroupElement(g));
    const msl=document.getElementById('master-slider'); if(msl) msl.value=masterVol;
    document.getElementById('master-val').textContent=Math.round(masterVol*100)+'%';
    document.getElementById('st-master').textContent=Math.round(masterVol*100)+'%';
    syncCatVolUI();
    return true;
  }catch(e){ return false; }
}

// Sync the category fader sliders + labels to current catVol values
function syncCatVolUI(){
  CAT_ORDER.forEach(cat=>{
    catLiveVol[cat]=catVol[cat];
    const sl=document.getElementById(`catvol-slider-${cat}`); if(sl) sl.value=catVol[cat];
    const lbl=document.getElementById(`catvol-val-${cat}`); if(lbl) lbl.textContent=Math.round(catVol[cat]*100)+'%';
  });
}

// ════════════════════════════════════════════════
// KEYBOARD
// ════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const n=parseInt(e.key);
  if(!isNaN(n)&&n>=1&&n<=9){ const t=tracks[n-1]; if(t) togglePlay(t.id); return; }
  if(e.key==='s'||e.key==='S') stopAllFade();
  if(e.key==='Escape') hardStopAll();
});

document.addEventListener('click',e=>{
  if(!e.target.closest('.exp-cat-wrap') && !e.target.classList.contains('tc-cat'))
    document.querySelectorAll('.cat-popup.open').forEach(p=>p.classList.remove('open'));
  if(!e.target.closest('.exp-speed'))
    document.querySelectorAll('.exp-speed.open').forEach(s=>s.classList.remove('open'));
  if(!e.target.closest('.tc-grp-wrap') && !e.target.closest('.grp-popup-floating'))
    closeGroupPops();
});

// Close floating popups on scroll or resize so they don't float in the wrong place
window.addEventListener('scroll', closeGroupPops, true);
window.addEventListener('resize', closeGroupPops);

// ════════════════════════════════════════════════
// UTIL
// ════════════════════════════════════════════════
function fmtT(s){
  if(s===null||s===undefined||isNaN(s)) return '--:--';
  const m=Math.floor(s/60),sec=Math.floor(s%60).toString().padStart(2,'0'),ds=Math.floor((s%1)*10);
  return `${m}:${sec}.${ds}`;
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
const restored=loadAutoSave();
makeFloatingDraggable();
renderFavourites();
if(restored){
  layoutTracks();
  renderScenes();
  updateNotesBanner();
  syncCatVolUI();
  // Count missing audio
  const missing=tracks.filter(t=>t.filename && !t.src).length;
  const missingFav=favourites.filter(f=>!f.src).length;
  if(missing>0||missingFav>0) showToast(`Restored — re-upload audio (${missing} track${missing!==1?'s':''}${missingFav?`, ${missingFav} fav`:''}) via ↑ UPLOAD.`);
  else showToast('Session restored');
} else {
  // Demo tracks
  const t1=mkTrack('Rain Ambience','AMB'); tracks.push(t1); buildTrackElement(t1);
  const t2=mkTrack('Tension Drone','BGM'); tracks.push(t2); buildTrackElement(t2);
  const t3=mkTrack('Church Bell','SFX'); tracks.push(t3); buildTrackElement(t3);
  layoutTracks();
  renderScenes();
}
