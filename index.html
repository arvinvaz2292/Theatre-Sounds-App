<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Offside Sound v6 · by Arvin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
<style>
:root{
  --bg:#070a0d;--s1:#0e1318;--s2:#151b22;--s3:#1d242c;--s4:#252d36;
  --border:#202830;--border2:#161d24;
  --green:#00e676;--green2:#00b35a;--green-soft:rgba(0,230,118,.10);
  --amber:#ffc107;--amber-soft:rgba(255,193,7,.10);
  --red:#ff4444;--blue:#40c4ff;
  --muted:#3f5260;--muted2:#6a7d8b;--text:#d4dde4;--text2:#8aa0b0;
  --mono:'IBM Plex Mono',monospace;--display:'Bebas Neue',sans-serif;
  --cat-bgm:#40c4ff;--cat-sfx:#ffc107;--cat-amb:#00e676;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;overflow-x:hidden;font-size:13px}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.05) 3px,rgba(0,0,0,.05) 4px);pointer-events:none;z-index:9000}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:500;height:62px;background:rgba(7,10,13,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px}
.brand-name{font-family:var(--display);font-size:30px;letter-spacing:3px;line-height:1;flex-shrink:0}
.brand-sub{font-size:9px;color:var(--muted2);letter-spacing:2.5px;text-transform:uppercase;flex-shrink:0}
.topbar-sep{width:1px;height:30px;background:var(--border);flex-shrink:0}
.master-row{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted2);letter-spacing:1.5px;flex-shrink:0}
.master-row input[type=range]{width:100px}
.master-val{color:var(--green);min-width:36px;font-weight:600;font-size:11px}
.topbar-right{display:flex;gap:8px;margin-left:auto;align-items:center}
button{border:none;cursor:pointer;font-family:var(--mono);transition:all .14s}
.btn{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:9px 15px;border-radius:8px;white-space:nowrap}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted2)}.btn-ghost:hover{border-color:var(--muted2);color:var(--text)}
.btn-amber{background:transparent;border:1px solid var(--amber);color:var(--amber)}.btn-amber:hover{background:var(--amber);color:#000}
.btn-green{background:var(--green2);color:#000;border:none}.btn-green:hover{background:var(--green)}
.btn-stopall{background:transparent;border:1px solid var(--red);color:var(--red);position:relative;overflow:hidden;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:9px 15px;border-radius:8px}
.btn-stopall:hover{background:rgba(255,68,68,.1)}

/* per-category fade buttons */
.cat-fade-group{display:flex;gap:4px;flex-shrink:0}
.cat-fade-btn{background:transparent;border:1px solid;font-size:9px;font-weight:600;letter-spacing:1px;padding:7px 9px;border-radius:6px;cursor:pointer;font-family:var(--mono);transition:all .14s;white-space:nowrap}
.cat-fade-btn.BGM{color:var(--cat-bgm);border-color:rgba(64,196,255,.4)}
.cat-fade-btn.BGM:hover{background:var(--cat-bgm);color:#000;border-color:var(--cat-bgm)}
.cat-fade-btn.SFX{color:var(--cat-sfx);border-color:rgba(255,193,7,.4)}
.cat-fade-btn.SFX:hover{background:var(--cat-sfx);color:#000;border-color:var(--cat-sfx)}
.cat-fade-btn.AMB{color:var(--cat-amb);border-color:rgba(0,230,118,.4)}
.cat-fade-btn.AMB:hover{background:var(--cat-amb);color:#000;border-color:var(--cat-amb)}
.btn-stopall.fading{border-color:#ff8800;color:#ff8800;animation:pulse .6s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.5}}
.stopall-progress{position:absolute;bottom:0;left:0;height:2px;background:var(--red);width:0}
.upload-wrap{position:relative}
.upload-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* ── LAYOUT ── */
.app-body{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 62px - 36px);overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{background:linear-gradient(180deg,#1a0f08 0%,#120a06 50%,#0d0805 100%);border-right:1px solid #3a2410;display:flex;flex-direction:column;overflow:hidden;position:relative}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:.5}
.sidebar-header{padding:14px 16px 10px;border-bottom:1px solid rgba(255,193,7,.08);display:flex;align-items:center;gap:8px;flex-shrink:0;background:rgba(255,193,7,.03)}
.sidebar-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--amber);flex:1;font-weight:600;opacity:.85}
.scene-count-pill{font-size:9px;background:rgba(255,193,7,.1);border:1px solid rgba(255,193,7,.3);color:var(--amber);padding:2px 8px;border-radius:12px;font-weight:600}
.scene-list{flex:1;overflow-y:auto;padding:10px}
.scene-list::-webkit-scrollbar{width:4px}
.scene-list::-webkit-scrollbar-thumb{background:rgba(255,193,7,.2);border-radius:2px}

.scene-card{border-radius:10px;border:1px solid #2a1d10;overflow:hidden;margin-bottom:8px;transition:border-color .2s,box-shadow .2s,transform .15s;background:rgba(26,15,8,.6);backdrop-filter:blur(2px)}
.scene-card:hover{border-color:rgba(255,193,7,.35);transform:translateY(-1px)}
.scene-card.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green2),0 0 28px rgba(0,230,118,.15)}
.scene-card-top{display:flex;align-items:center;padding:9px 10px;gap:7px;border-bottom:1px solid rgba(255,193,7,.08);background:rgba(255,193,7,.04)}
.scene-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,193,7,.3);flex-shrink:0;transition:background .2s}
.scene-card.active .scene-dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.scene-name{font-size:13px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;letter-spacing:.3px;color:#f3e3c4}
.scene-card.active .scene-name{color:var(--green)}
.scene-name-input{font-family:var(--mono);font-size:13px;font-weight:600;background:transparent;border:none;border-bottom:1px solid var(--green);color:#f3e3c4;outline:none;width:100%}

/* scene icon buttons (up/down/dup/del) */
.scene-card-icons{display:flex;gap:1px;flex-shrink:0}
.scene-icon{background:transparent;border:none;color:rgba(255,193,7,.5);font-size:10px;width:20px;height:20px;border-radius:4px;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;padding:0}
.scene-icon:hover:not(:disabled){color:var(--amber);background:rgba(255,193,7,.12)}
.scene-icon:disabled{opacity:.25;cursor:default}
.scene-icon.del{color:rgba(255,68,68,.5)}
.scene-icon.del:hover{color:var(--red);background:rgba(255,68,68,.15)}

.scene-preview{padding:6px 11px 4px;display:flex;flex-direction:column;gap:3px}
.sp-row{font-size:10px;color:rgba(243,227,196,.65);display:flex;align-items:center;gap:6px}
.sp-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,193,7,.25);flex-shrink:0}
.sp-dot.on{background:var(--green)}
.sp-dot.staged{background:var(--amber)}
.sp-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-vol{color:rgba(255,193,7,.5);font-size:9px;flex-shrink:0;font-weight:600}
.sp-more{font-size:9px;color:rgba(255,193,7,.4);margin-top:2px;font-style:italic}

.scene-notes-zone{padding:6px 11px;border-top:1px solid rgba(255,193,7,.08);background:rgba(0,0,0,.18)}
.scene-notes{width:100%;background:transparent;border:none;color:rgba(243,227,196,.72);font-family:var(--mono);font-size:10px;line-height:1.6;resize:none;outline:none;min-height:36px;max-height:120px}
.scene-notes::placeholder{color:rgba(255,193,7,.3)}
.scene-notes:focus{color:#f3e3c4}

.scene-fade-row{display:flex;align-items:center;gap:5px;padding:5px 11px;border-top:1px solid rgba(255,193,7,.08);font-size:9px;color:rgba(255,193,7,.55);letter-spacing:1px}
.scene-fade-row input{width:38px;background:rgba(0,0,0,.3);border:1px solid rgba(255,193,7,.15);border-radius:4px;color:#f3e3c4;font-family:var(--mono);font-size:10px;padding:3px 5px;outline:none;text-align:center}
.scene-fade-row input:focus{border-color:var(--blue)}

.scene-actions{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid rgba(255,193,7,.08)}
.sa-btn{background:transparent;border:none;color:rgba(243,227,196,.6);font-size:10px;letter-spacing:1.2px;padding:9px 6px;cursor:pointer;font-family:var(--mono);font-weight:600;text-transform:uppercase;transition:all .12s}
.sa-btn:not(:last-child){border-right:1px solid rgba(255,193,7,.08)}
.sa-btn.fire:hover{background:var(--green2);color:#fff}
.sa-btn.xfade:hover{background:rgba(64,196,255,.15);color:var(--blue)}
.sa-btn.update:hover{background:rgba(255,193,7,.15);color:var(--amber)}

.sidebar-footer{border-top:1px solid rgba(255,193,7,.1);padding:10px;flex-shrink:0;display:flex;flex-direction:column;gap:7px;background:rgba(255,193,7,.03)}
.btn-add-scene{background:rgba(26,15,8,.6);border:1px dashed rgba(255,193,7,.3);color:var(--amber);font-size:10px;padding:9px;border-radius:8px;letter-spacing:1px;cursor:pointer;font-family:var(--mono);transition:all .14s;width:100%;text-align:center;font-weight:600;opacity:.85}
.btn-add-scene:hover{border-color:var(--amber);opacity:1;background:rgba(255,193,7,.08)}
.persist-row{display:flex;gap:6px}
.btn-persist{flex:1;font-size:9px;letter-spacing:1px;padding:7px;border-radius:6px;text-align:center;font-family:var(--mono);font-weight:600;text-transform:uppercase;cursor:pointer;background:rgba(26,15,8,.6);border:1px solid #2a1d10;color:rgba(255,193,7,.6);transition:all .12s;position:relative}
.btn-export:hover{border-color:var(--blue);color:var(--blue)}
.btn-import:hover{border-color:var(--amber);color:var(--amber)}
.btn-import input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* ── TRACK AREA ── */
.track-area{overflow-y:auto;padding-bottom:50px;background:var(--bg)}
.track-area::-webkit-scrollbar{width:6px}
.track-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* notes banner */
.notes-banner{margin:14px 18px 0;background:var(--amber-soft);border:1px solid rgba(255,193,7,.3);border-radius:10px;padding:12px 16px;display:none}
.notes-banner.visible{display:block}
.notes-banner-lbl{font-size:9px;letter-spacing:2.5px;color:var(--amber);text-transform:uppercase;margin-bottom:6px;font-weight:600;display:flex;align-items:center;gap:10px}
.notes-banner-lbl::after{content:'';flex:1;height:1px;background:rgba(255,193,7,.25)}
.notes-banner-text{font-size:13px;color:var(--text);line-height:1.75;white-space:pre-wrap;word-break:break-word}

/* pool headers */
.pool-header{padding:14px 18px 6px;display:flex;align-items:center;gap:10px;user-select:none}
.pool-header-label{font-size:9px;letter-spacing:3px;color:var(--muted2);text-transform:uppercase;font-weight:600}
.pool-header-label.active{color:var(--green)}
.pool-header::after{content:'';flex:1;height:1px;background:var(--border2)}
.pool-count{font-size:9px;color:var(--muted);background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:1px 8px}

.pool-wrap{padding:0 18px}
.active-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;min-height:8px}
.active-cat-divider{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600;margin-top:4px}
.active-cat-divider:first-child{margin-top:0}
.active-cat-divider span{padding:3px 10px;border-radius:11px;border:1px solid}
.active-cat-divider.BGM span{color:var(--cat-bgm);border-color:rgba(64,196,255,.4);background:rgba(64,196,255,.08)}
.active-cat-divider.SFX span{color:var(--cat-sfx);border-color:rgba(255,193,7,.4);background:rgba(255,193,7,.08)}
.active-cat-divider.AMB span{color:var(--cat-amb);border-color:rgba(0,230,118,.4);background:rgba(0,230,118,.08)}
.active-cat-divider::after{content:'';flex:1;height:1px;background:var(--border2)}
.inactive-pool{display:flex;flex-direction:column;gap:5px;padding-bottom:20px}

.cat-divider{padding:14px 0 4px;display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600}
.cat-divider span{padding:3px 9px;border-radius:11px;border:1px solid}
.cat-divider.BGM span{color:var(--cat-bgm);border-color:rgba(64,196,255,.4);background:rgba(64,196,255,.08)}
.cat-divider.SFX span{color:var(--cat-sfx);border-color:rgba(255,193,7,.4);background:rgba(255,193,7,.08)}
.cat-divider.AMB span{color:var(--cat-amb);border-color:rgba(0,230,118,.4);background:rgba(0,230,118,.08)}
.cat-divider::after{content:'';flex:1;height:1px;background:var(--border2)}

/* ═══ GROUPS ═══ */
.grp-section{margin-bottom:8px}
.grp-section-label{padding:14px 0 6px;display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600;color:#c89bff}
.grp-section-label span:first-child{padding:3px 9px;border-radius:11px;border:1px solid rgba(200,155,255,.4);background:rgba(200,155,255,.08)}
.grp-section-label::after{content:'';flex:1;height:1px;background:var(--border2)}

.group-bar{background:linear-gradient(90deg,rgba(200,155,255,.10) 0%,rgba(200,155,255,.04) 30%,var(--s1) 100%);border:1px solid rgba(200,155,255,.3);border-radius:12px;display:flex;align-items:center;gap:9px;padding:10px 13px;margin-bottom:7px;transition:border-color .2s,box-shadow .2s;flex-wrap:wrap}
.group-bar:hover{border-color:rgba(200,155,255,.5)}
.group-bar.is-playing{border-color:var(--green);box-shadow:0 0 0 1px var(--green2),0 0 30px rgba(0,230,118,.1)}
.grp-icon{font-size:16px;color:#c89bff;flex-shrink:0}
.grp-info{flex:1;min-width:120px;overflow:hidden}
.grp-name{font-family:var(--display);font-size:18px;letter-spacing:.5px;line-height:1.1;color:#e8d5ff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-name:hover{color:var(--green)}
.grp-meta{font-size:9px;color:rgba(200,155,255,.6);letter-spacing:.5px;margin-top:2px}
.grp-play{background:rgba(200,155,255,.1);border:1px solid rgba(200,155,255,.4);color:#c89bff;width:38px;height:38px;border-radius:7px;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .14s}
.grp-play:hover{background:rgba(200,155,255,.2);color:#fff;border-color:#c89bff}
.grp-play.on{background:var(--green);color:#000;border-color:var(--green)}
.grp-stop{background:var(--s2);border:1px solid var(--border);color:var(--muted2);width:38px;height:38px;border-radius:7px;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .14s}
.grp-stop:hover{border-color:var(--red);color:var(--red)}
.grp-vol-wrap{display:flex;align-items:center;gap:7px;flex:1;min-width:140px}
.grp-vol-lbl{font-size:8px;letter-spacing:2px;color:rgba(200,155,255,.6);font-weight:600}
.grp-vol-wrap input[type=range]{flex:1;height:4px}
.grp-vol-wrap input[type=range]::-webkit-slider-thumb{background:#c89bff}
.grp-vol-pct{font-size:12px;font-weight:600;color:#c89bff;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.grp-fade{background:transparent;border:1px solid rgba(200,155,255,.3);color:#c89bff;width:30px;height:30px;border-radius:6px;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .14s}
.grp-fade:hover{background:rgba(200,155,255,.15);border-color:#c89bff}
.grp-del{background:transparent;border:1px solid transparent;color:var(--muted);font-size:13px;width:28px;height:28px;border-radius:5px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.grp-del:hover{border-color:var(--red);color:var(--red)}

/* Group badge on collapsed track */
.tc-grp-wrap{position:relative;flex-shrink:0}
.tc-grp-btn{background:rgba(200,155,255,.1);border:1px solid rgba(200,155,255,.4);color:#c89bff;font-size:9px;font-weight:600;letter-spacing:.5px;padding:3px 7px;border-radius:5px;cursor:pointer;display:none;align-items:center;height:24px}
.tc-grp-btn:hover{background:rgba(200,155,255,.2)}
.tc-grp-plus{background:transparent;border:1px dashed rgba(200,155,255,.3);color:rgba(200,155,255,.5);font-size:9px;font-weight:600;letter-spacing:.5px;padding:3px 7px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;height:24px;transition:all .12s}
.tc-grp-plus:hover{border-color:#c89bff;color:#c89bff;background:rgba(200,155,255,.1)}

/* Group popup (rendered floating on document.body to escape track-item overflow:hidden) */
.grp-popup-floating{position:fixed;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:6px;z-index:9999;display:flex;flex-direction:column;gap:3px;min-width:180px;max-width:260px;box-shadow:0 12px 36px rgba(0,0,0,.7);animation:popIn .12s ease both}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.grp-pop-title{font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;font-weight:600;padding:4px 7px}
.grp-pop-btn{background:var(--s3);border:1px solid var(--border);color:var(--text2);font-size:10px;padding:7px 11px;border-radius:5px;cursor:pointer;font-family:var(--mono);transition:all .12s;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:600;letter-spacing:.3px}
.grp-pop-btn:hover{border-color:#c89bff;color:#c89bff;background:rgba(200,155,255,.08)}
.grp-pop-btn.remove{border-color:rgba(255,68,68,.3);color:var(--red)}
.grp-pop-btn.remove:hover{background:var(--red);color:#fff;border-color:var(--red)}
.grp-pop-btn.new{border-style:dashed;color:var(--amber);border-color:rgba(255,193,7,.3)}
.grp-pop-btn.new:hover{border-color:var(--amber);background:rgba(255,193,7,.1)}
.grp-pop-divider{height:1px;background:var(--border);margin:4px 0}

/* ═══ TRACK ITEM ═══ */
/* Single track element that toggles between collapsed/expanded via class */
.track-item{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.track-item.is-playing{border-color:var(--green2);box-shadow:0 0 0 1px var(--green2),0 4px 30px rgba(0,230,118,.08)}
.track-item .accent-bar{height:2px;background:var(--accent,var(--border));transition:background .3s}
.track-item.is-playing .accent-bar{background:var(--green)}

/* ─── COLLAPSED VIEW (default) ─── */
.track-item .expanded-view{display:none}
.track-item .collapsed-view{display:flex;align-items:center;gap:10px;padding:9px 12px}
.track-item.is-expanded .collapsed-view{display:none}
.track-item.is-expanded .expanded-view{display:block}

.tc-name{font-family:var(--display);font-size:17px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;line-height:1;cursor:pointer}
.tc-name:hover{color:var(--green)}
.tc-cat{font-size:8px;font-weight:600;letter-spacing:1.5px;padding:2px 6px;border-radius:8px;border:1px solid;flex-shrink:0;cursor:pointer}
.tc-cat.BGM{color:var(--cat-bgm);border-color:rgba(64,196,255,.4);background:rgba(64,196,255,.08)}
.tc-cat.SFX{color:var(--cat-sfx);border-color:rgba(255,193,7,.4);background:rgba(255,193,7,.08)}
.tc-cat.AMB{color:var(--cat-amb);border-color:rgba(0,230,118,.4);background:rgba(0,230,118,.08)}
.tc-vol-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0;width:175px}
.tc-vol-wrap input[type=range]{flex:1;height:4px}
.tc-vol-pct{font-size:13px;font-weight:600;color:var(--green);min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.tc-play{background:var(--s2);border:1px solid var(--border);color:var(--text2);width:38px;height:38px;border-radius:8px;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .14s}
.tc-play:hover{border-color:var(--green2);color:var(--green)}
.tc-play.on{background:var(--green);color:#000;border-color:var(--green)}
.tc-stop{background:var(--s2);border:1px solid var(--border);color:var(--muted2);width:38px;height:38px;border-radius:8px;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .14s}
.tc-stop:hover{border-color:var(--red);color:var(--red)}
.tc-expand{background:transparent;border:none;color:var(--muted);font-size:14px;width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .12s}
.tc-expand:hover{color:var(--text);background:var(--s3)}

/* "Add to scene" / "Remove from scene" buttons */
.tc-addscene{background:transparent;border:1px solid var(--amber);color:var(--amber);font-size:9px;font-weight:600;letter-spacing:1px;padding:4px 8px;border-radius:5px;cursor:pointer;flex-shrink:0;transition:all .12s;display:flex;align-items:center}
.tc-addscene:hover{background:var(--amber);color:#000}
.scene-btn-x{border:1px solid var(--red)!important;color:var(--red)!important;font-size:9px!important;font-weight:600;letter-spacing:.5px;padding:0 8px!important;width:auto!important}
.scene-btn-x:hover{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important}
.scene-btn-add{border:1px solid var(--amber)!important;color:var(--amber)!important;font-size:9px!important;font-weight:600;letter-spacing:.5px;padding:0 8px!important;width:auto!important}
.scene-btn-add:hover{background:var(--amber)!important;color:#000!important;border-color:var(--amber)!important}

/* Staged tracks (in active scene but not playing) have a subtle amber tint */
.track-item.staged:not(.is-playing){border-color:rgba(255,193,7,.35)}
.track-item.staged:not(.is-playing) .accent-bar{background:rgba(255,193,7,.5)}

/* Track is missing its audio file (e.g. after session restore) */
.track-item.missing-audio{border-style:dashed;border-color:rgba(255,171,0,.35);opacity:.88}
.track-item.missing-audio .accent-bar{background:repeating-linear-gradient(90deg,rgba(255,171,0,.6) 0 6px,transparent 6px 12px)}

/* ─── EXPANDED VIEW ─── */
.exp-header{display:flex;align-items:flex-start;padding:13px 15px 9px;gap:9px}
.exp-name-wrap{flex:1;min-width:0}
.exp-name{font-family:var(--display);font-size:22px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.1;transition:color .12s}
.exp-name:hover{color:var(--green)}
.exp-name-input{font-family:var(--display);font-size:22px;letter-spacing:1px;background:transparent;border:none;border-bottom:1px solid var(--green);color:var(--text);outline:none;width:100%}
.exp-meta{display:flex;align-items:center;gap:7px;margin-top:3px}
.exp-filename{font-size:9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;letter-spacing:.5px}
.exp-cat-wrap{position:relative;flex-shrink:0}
.exp-cat{font-size:9px;font-weight:600;letter-spacing:1.5px;padding:3px 8px;border-radius:11px;border:1px solid;cursor:pointer;transition:opacity .12s}
.exp-cat.BGM{color:var(--cat-bgm);border-color:rgba(64,196,255,.4);background:rgba(64,196,255,.08)}
.exp-cat.SFX{color:var(--cat-sfx);border-color:rgba(255,193,7,.4);background:rgba(255,193,7,.08)}
.exp-cat.AMB{color:var(--cat-amb);border-color:rgba(0,230,118,.4);background:rgba(0,230,118,.08)}
.exp-cat:hover{opacity:.75}
.cat-popup{display:none;position:absolute;top:calc(100% + 5px);right:0;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:6px;z-index:100;flex-direction:column;gap:4px;min-width:75px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.cat-popup.open{display:flex}
.cat-popup button{background:var(--s3);border:1px solid var(--border);color:var(--muted2);font-size:9px;padding:5px 8px;border-radius:5px;cursor:pointer;font-family:var(--mono);transition:all .12s;text-align:center;font-weight:600;letter-spacing:1px}
.cat-popup button:hover{border-color:var(--green);color:var(--text)}

.exp-actions{display:flex;gap:3px;flex-shrink:0}
.exp-icon-btn{background:transparent;border:1px solid transparent;color:var(--muted);font-size:13px;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.exp-icon-btn:hover{border-color:var(--border);color:var(--text)}
.exp-icon-btn.del:hover{border-color:var(--red);color:var(--red)}

.exp-wave-zone{padding:0 15px}
.exp-wave{background:var(--s2);border-radius:9px;overflow:hidden;height:74px;cursor:crosshair}
.exp-time-strip{display:flex;justify-content:space-between;padding:4px 2px 0;font-size:10px;color:var(--muted2);font-variant-numeric:tabular-nums}
.exp-time-cur{color:var(--green);font-weight:600}

.exp-transport{display:flex;gap:7px;padding:10px 15px 7px;align-items:center}
.exp-play{flex:1;background:var(--s2);border:1px solid var(--border);color:var(--text2);font-size:12px;font-weight:600;letter-spacing:1.5px;padding:12px;border-radius:8px;text-transform:uppercase;cursor:pointer;transition:all .14s}
.exp-play:hover{border-color:var(--green2);color:var(--green)}
.exp-play.is-playing{background:var(--green);color:#000;border-color:var(--green)}
.exp-stop{background:var(--s2);border:1px solid var(--border);color:var(--muted2);width:44px;height:44px;border-radius:8px;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .14s}
.exp-stop:hover{border-color:var(--red);color:var(--red)}
.exp-speed{position:relative;flex-shrink:0}
.exp-speed-badge{background:var(--s2);border:1px solid var(--border);color:var(--muted2);font-size:10px;height:44px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;letter-spacing:1px}
.exp-speed-badge:hover{border-color:var(--blue);color:var(--blue)}
.exp-speed-badge .sv{color:var(--blue);font-weight:600}
.exp-speed-popup{display:none;position:absolute;bottom:calc(100% + 6px);right:0;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:11px;z-index:200;min-width:175px;box-shadow:0 8px 28px rgba(0,0,0,.6)}
.exp-speed.open .exp-speed-popup{display:block}
.exp-speed-lbl{font-size:10px;color:var(--muted2);display:flex;justify-content:space-between;margin-bottom:7px;letter-spacing:1px}
.exp-speed-lbl span{color:var(--blue);font-weight:600}
.exp-speed-presets{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.exp-speed-preset{background:var(--s3);border:1px solid var(--border);color:var(--muted2);font-size:9px;padding:4px 7px;border-radius:5px;cursor:pointer;font-family:var(--mono);transition:all .1s;font-weight:600}
.exp-speed-preset:hover{border-color:var(--blue);color:var(--blue)}

.exp-upload-zone{padding:0 15px 7px}
.exp-upload{display:flex;align-items:center;gap:9px;background:var(--s2);border:1px dashed var(--border);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:11px;color:var(--muted);transition:all .14s}
.exp-upload:hover{border-color:var(--green2);color:var(--green)}
.exp-upload input{display:none}
.exp-upload-fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.exp-vol-section{padding:9px 15px 11px;display:flex;align-items:center;gap:14px}
.exp-vol-knob{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;min-width:60px}
.exp-vol-pct{font-size:24px;font-weight:600;font-family:var(--display);letter-spacing:1px;color:var(--green);font-variant-numeric:tabular-nums}
.exp-vol-lbl{font-size:8px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;font-weight:600}
.exp-sliders{flex:1;display:flex;flex-direction:column;gap:9px}
.exp-sl-row{display:flex;align-items:center;gap:9px}
.exp-sl-tag{font-size:8px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;width:18px;text-align:right;flex-shrink:0;font-weight:600}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:var(--border);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--green);cursor:pointer;transition:transform .1s,box-shadow .1s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3);box-shadow:0 0 0 5px rgba(0,230,118,.2)}
input[type=range].blue-r::-webkit-slider-thumb{background:var(--blue)}
.exp-autostop{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.exp-autostop input{width:46px;background:var(--s2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:10px;padding:3px 5px;outline:none;text-align:center}
.exp-autostop input:focus{border-color:var(--green)}
.exp-vol-fades{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.exp-fade-btn{width:52px;height:34px;border-radius:7px;font-size:17px;display:flex;align-items:center;justify-content:center;background:var(--s2);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .14s}
.exp-fade-btn:hover{border-color:var(--green);color:var(--green)}
.exp-fade-btn.kill{font-size:13px}.exp-fade-btn.kill:hover{border-color:var(--red);color:var(--red)}

.exp-divider{height:1px;background:var(--border2);margin:0 15px}


.exp-loop{background:var(--s2);border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);padding:0}
/* Loop is now a collapsible dropdown */
.exp-loop-toggle{width:100%;display:flex;align-items:center;gap:10px;padding:11px 15px;background:transparent;border:none;cursor:pointer;font-family:var(--mono);transition:background .12s}
.exp-loop-toggle:hover{background:rgba(255,255,255,.02)}
.exp-loop-summary{margin-left:auto;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.exp-loop-summary.active{color:var(--amber)}
.exp-loop-caret{font-size:10px;color:var(--muted2);width:12px;text-align:center}
.exp-loop-dropdown{display:none;padding:0 15px 12px}
.exp-loop-dropdown.open{display:block}
.exp-loop-head{display:flex;align-items:center;justify-content:flex-end;margin-bottom:9px}
.exp-loop-title{font-size:10px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase;font-weight:600}
.exp-loop-right{display:flex;align-items:center;gap:10px}
/* BGM tracks: no loop / cue at all */
.track-item.is-bgm .exp-loopcue{display:none}
.tog{position:relative;width:36px;height:20px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog-track{position:absolute;inset:0;background:var(--s3);border-radius:20px;border:1px solid var(--border);cursor:pointer;transition:background .2s,border-color .2s}
.tog input:checked+.tog-track{background:var(--green2);border-color:var(--green)}
.tog-thumb{position:absolute;top:3px;left:3px;width:12px;height:12px;background:#fff;border-radius:50%;transition:left .18s;pointer-events:none}
.tog input:checked~.tog-thumb{left:19px}
.exp-loop-state{font-size:9px;color:var(--muted);letter-spacing:1.5px;font-weight:600}
.exp-loop-count{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted)}
.exp-loop-count input{width:42px;background:var(--s3);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:10px;padding:3px 5px;outline:none;text-align:center}
.exp-loop-count input:focus{border-color:var(--green)}
.exp-loop-chips{display:flex;gap:6px;margin-bottom:8px}
.exp-loop-chip{flex:1;background:var(--s3);border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-size:9px;display:flex;flex-direction:column;gap:2px}
.exp-chip-lbl{color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-size:8px;font-weight:600}
.exp-chip-val{color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums;font-size:11px}
.exp-loop-actions{display:flex;gap:5px;flex-wrap:wrap}
.exp-loop-btn{flex:1;min-width:62px;background:var(--s3);border:1px solid var(--border);color:var(--text2);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:7px 6px;border-radius:6px;cursor:pointer;font-family:var(--mono);transition:all .12s;text-align:center;font-weight:600}
.exp-loop-btn:hover{border-color:var(--amber);color:var(--amber)}
.exp-loop-hint{font-size:9px;color:var(--muted);font-style:italic;margin-top:7px;letter-spacing:.3px}

.exp-cues{padding:10px 15px}
.exp-cues-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.exp-cues-title{font-size:10px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase;font-weight:600}
.exp-add-cue{background:transparent;border:1px solid var(--border);color:var(--muted2);font-size:9px;padding:4px 9px;border-radius:5px;cursor:pointer;font-family:var(--mono);letter-spacing:.5px;transition:all .12s;font-weight:600}
.exp-add-cue:hover{border-color:var(--blue);color:var(--blue)}
.exp-cue-list{display:flex;flex-wrap:wrap;gap:5px;min-height:20px}
.exp-cue-chip{display:flex;align-items:stretch;border-radius:6px;border:1px solid var(--border);overflow:hidden}
.exp-cue-jump{background:var(--s3);color:var(--text2);padding:5px 9px;cursor:pointer;font-family:var(--mono);font-size:9px;border:none;display:flex;flex-direction:column;gap:1px;transition:background .12s;text-align:left}
.exp-cue-jump:hover{background:var(--blue);color:#000}
.exp-cue-lbl{font-weight:600;letter-spacing:.5px}
.exp-cue-t{color:var(--muted2);font-size:8px}
.exp-cue-jump:hover .exp-cue-t{color:rgba(0,0,0,.6)}
.exp-cue-rm{background:var(--s2);color:var(--muted);border:none;border-left:1px solid var(--border);padding:5px 7px;cursor:pointer;font-size:11px;transition:all .12s}
.exp-cue-rm:hover{background:var(--red);color:#fff}
.exp-cue-empty{font-size:10px;color:var(--muted);font-style:italic}

/* status */
.status{position:fixed;bottom:0;left:0;right:0;height:36px;background:rgba(7,10,13,.97);border-top:1px solid var(--border);display:flex;align-items:center;gap:22px;padding:0 22px;font-size:10px;color:var(--muted);letter-spacing:1.5px;z-index:600}
.status-item{display:flex;align-items:center;gap:6px}
.status-val{color:var(--text2);font-weight:600}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.live-dot.on{background:var(--green);box-shadow:0 0 7px var(--green);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.kb-hint{margin-left:auto;font-size:9px;color:var(--muted);display:flex;gap:14px}
.kb-key{background:var(--s2);border:1px solid var(--border);border-radius:3px;padding:1px 6px;font-size:8px;color:var(--text2)}

.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--green2);color:var(--green);font-size:11px;padding:9px 18px;border-radius:8px;z-index:9999;letter-spacing:1px;pointer-events:none;opacity:0;transition:opacity .3s;font-weight:600}
.toast.show{opacity:1}

.empty-msg{text-align:center;padding:60px 20px;color:var(--muted);font-size:12px;line-height:2}
.empty-msg strong{color:var(--text2)}

/* blue topbar button */
.btn-blue{background:transparent;border:1px solid var(--blue);color:var(--blue)}
.btn-blue:hover{background:var(--blue);color:#000}

/* add-track button in pool header */
.pool-add-btn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--muted2);font-size:10px;font-weight:600;letter-spacing:1px;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:var(--mono);transition:all .12s}
.pool-add-btn:hover{border-color:var(--green);color:var(--green)}

/* ══ FLOATING CONTROL WINDOW ══ */
.float-window{position:fixed;top:70px;right:22px;width:300px;background:rgba(14,19,24,.98);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 50px rgba(0,0,0,.6);z-index:800;display:flex;flex-direction:column;max-height:calc(100vh - 110px);transition:opacity .2s,transform .2s;contain:layout style;will-change:left,top}
.float-window.dragging{transition:none;box-shadow:0 24px 60px rgba(0,0,0,.75)}
.float-window.hidden{opacity:0;transform:scale(.95);pointer-events:none}
.float-handle{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:grab;border-bottom:1px solid var(--border);background:rgba(64,196,255,.06);border-radius:14px 14px 0 0;user-select:none;-webkit-user-select:none;touch-action:none}
.float-handle:active{cursor:grabbing}
.float-title{font-size:11px;letter-spacing:2px;color:var(--blue);font-weight:600;pointer-events:none}
.float-close{background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;width:24px;height:24px;border-radius:5px;transition:all .12s}
.float-close:hover{color:var(--red);background:var(--s3)}
.float-body{padding:13px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:11px;-webkit-overflow-scrolling:touch}
.float-body::-webkit-scrollbar{width:5px}
.float-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.fw-fader{display:flex;flex-direction:column;gap:6px}
.fw-fader-top{display:flex;align-items:center;justify-content:space-between}
.fw-fader-lbl{font-size:10px;letter-spacing:2px;font-weight:600;color:var(--muted2)}
.fw-fader-lbl.bgm{color:var(--cat-bgm)}
.fw-fader-lbl.sfx{color:var(--cat-sfx)}
.fw-fader-lbl.amb{color:var(--cat-amb)}
.fw-master .fw-fader-lbl{color:var(--green)}
.fw-fader-val{font-size:12px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.fw-fader-row{display:flex;align-items:center;gap:8px}
.fw-fader-row input[type=range]{flex:1;height:5px}
.fw-master .fw-fader-row input[type=range]::-webkit-slider-thumb{background:var(--green)}
.fw-fader[data-cat=BGM] input[type=range]::-webkit-slider-thumb{background:var(--cat-bgm)}
.fw-fader[data-cat=SFX] input[type=range]::-webkit-slider-thumb{background:var(--cat-sfx)}
.fw-fader[data-cat=AMB] input[type=range]::-webkit-slider-thumb{background:var(--cat-amb)}
.fw-nudge{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.fw-nudge button{width:22px;height:15px;background:var(--s3);border:1px solid var(--border);color:var(--muted2);font-size:7px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .1s}
.fw-nudge button:hover{border-color:var(--text2);color:var(--text)}
.fw-fade-btns{display:flex;gap:5px;margin-top:2px}
.fw-fade-btns button{flex:1;background:var(--s3);border:1px solid var(--border);color:var(--muted2);font-size:9px;letter-spacing:.5px;padding:5px;border-radius:5px;cursor:pointer;font-family:var(--mono);transition:all .12s}
.fw-fade-btns button:hover{border-color:var(--text2);color:var(--text)}
.fw-divider{height:1px;background:var(--border2)}
.fw-fadeall{background:transparent;border:1px solid var(--red);color:var(--red);font-size:11px;font-weight:600;letter-spacing:1.5px;padding:9px;border-radius:8px;cursor:pointer;font-family:var(--mono);transition:all .12s;text-transform:uppercase}
.fw-fadeall:hover{background:var(--red);color:#fff}
.fw-section-title{font-size:11px;letter-spacing:2px;color:var(--amber);font-weight:600}
.fw-fav-head{display:flex;align-items:center;justify-content:space-between}
.fw-fav-add{font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--amber);background:transparent;border:1px dashed rgba(255,193,7,.4);padding:4px 10px;border-radius:6px;cursor:pointer;position:relative;transition:all .12s}
.fw-fav-add:hover{background:rgba(255,193,7,.1)}
.fw-fav-add input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.fav-list{display:flex;flex-direction:column;gap:5px}
.fav-empty{font-size:10px;color:var(--muted);font-style:italic;line-height:1.6;padding:4px 0}

.fav-chip.fav-missing{opacity:.5;border-style:dashed}

<script>
// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
let tracks=[], scenes=[], groups=[], masterVol=1, uid=0, gid=0, activeSceneId=null;
let favourites=[]; // one-shot favourite sounds: {id,name,src,filename}
let fid=0;
const catVol={BGM:1,SFX:1,AMB:1}; // per-category volume multipliers (fader target)
const catLiveVol={BGM:1,SFX:1,AMB:1}; // actual live category level (for fades)
const catFadeTimer={BGM:null,SFX:null,AMB:null};
const seekDragging={};
const expandedIds=new Set();
const CAT_ORDER=['BGM','SFX','AMB'];
const CAT_DESC={BGM:'Background Music',SFX:'Sound Effects',AMB:'Ambience'};
const CAT_ACCENTS={
  BGM:['#40c4ff','#29b6f6','#81d4fa','#4fc3f7'],
  SFX:['#ffc107','#ffab00','#ffe082','#ffd54f'],
  AMB:['#00e676','#00c853','#69f0ae','#00bfa5'],
};
let catC={BGM:0,SFX:0,AMB:0};

function effectiveVol(t){
  const g=groupOfTrack(t);
  return t.volume * (g?g.volume:1) * (catVol[t.cat]??1) * masterVol;
}

// Group lookup helpers
function gById(id){ return groups.find(g=>g.id===id); }
function groupOfTrack(t){ return groups.find(g=>g.trackIds.includes(t.id))||null; }
function mkGroup(name='New Group'){ return {id:'g'+(++gid), name, volume:1, fadeTimer:null, el:null, trackIds:[]}; }

function mkTrack(name='New Track',cat='AMB'){
  const idx=catC[cat]++%CAT_ACCENTS[cat].length;
  return{id:++uid,name,cat,src:null,filename:null,
    playing:false,volume:1,speed:1,
    loopEnabled:false,loopStart:null,loopEnd:null,loopCount:0,loopPlays:0,
    autoStop:0,autoStopTimer:null,fadeTimer:null,
    cues:[],ws:null,region:null,_rp:null,
    accent:CAT_ACCENTS[cat][idx],order:uid,
    el:null}; // the persistent DOM element for this track
}
function tById(id){return tracks.find(t=>t.id===id);}

// ════════════════════════════════════════════════
// GROUPS — operations
// ════════════════════════════════════════════════
function createGroup(){
  const name=prompt('Group name:',`Group ${groups.length+1}`);
  if(!name) return;
  const g=mkGroup(name.trim()||`Group ${groups.length+1}`);
  groups.push(g);
  buildGroupElement(g);
  layoutTracks();
  showToast(`Created group "${g.name}"`);
  autoSave();
}

function createGroupFromTrack(trackId){
  const name=prompt('Group name:',`Group ${groups.length+1}`);
  if(!name) return;
  const g=mkGroup(name.trim()||`Group ${groups.length+1}`);
  groups.push(g);
  buildGroupElement(g);
  addTrackToGroup(trackId, g.id);
}

function deleteGroup(id){
  const g=gById(id); if(!g) return;
  if(!confirm(`Delete group "${g.name}"? Tracks will remain.`)) return;
  clearInterval(g.fadeTimer);
  // Refresh audio on member tracks (no more group attenuation)
  g.trackIds.map(tById).filter(Boolean).forEach(t=>{
    if(t.ws) t.ws.setVolume(effectiveVol(t));
  });
  if(g.el) g.el.remove();
  groups=groups.filter(x=>x.id!==id);
  layoutTracks();
  autoSave();
}

function renameGroup(id){
  const g=gById(id); if(!g) return;
  const name=prompt('Rename group:',g.name);
  if(name===null) return;
  g.name=name.trim()||g.name;
  refreshGroupDisplay(g);
  autoSave();
}

function addTrackToGroup(trackId, groupId){
  const t=tById(trackId), g=gById(groupId);
  if(!t||!g) return;
  // Remove from any other group first
  groups.forEach(x=>{
    const idx=x.trackIds.indexOf(trackId);
    if(idx>=0){ x.trackIds.splice(idx,1); refreshGroupDisplay(x); }
  });
  g.trackIds.push(trackId);
  refreshGroupDisplay(g);
  // Refresh audio volume to apply group attenuation
  if(t.ws) t.ws.setVolume(effectiveVol(t));
  // Refresh the track UI to show its group badge
  refreshTrackGroupBadge(t);
  layoutTracks();
  autoSave();
}

function removeTrackFromGroup(trackId){
  const g=groups.find(x=>x.trackIds.includes(trackId));
  if(!g) return;
  g.trackIds=g.trackIds.filter(id=>id!==trackId);
  refreshGroupDisplay(g);
  const t=tById(trackId);
  if(t){
    if(t.ws) t.ws.setVolume(effectiveVol(t));
    refreshTrackGroupBadge(t);
  }
  layoutTracks();
  autoSave();
}

// Play/pause toggle for entire group — fires all members nearly simultaneously
async function groupTogglePlay(id){
  const g=gById(id); if(!g) return;
  const members=g.trackIds.map(tById).filter(t=>t && t.src);
  if(!members.length){ showToast('Group is empty or tracks lack audio'); return; }
  // If any are playing, pause all. Otherwise sync-start.
  const anyPlaying=members.some(t=>t.playing);
  if(anyPlaying){
    members.forEach(t=>{ if(t.ws && t.playing) t.ws.pause(); });
    return;
  }
  // Ensure every member has a WaveSurfer ready (auto-expand if needed)
  let needLayout=false;
  members.forEach(t=>{
    if(!t.ws && !isTrackExpanded(t)){
      expandedIds.add(t.id);
      needLayout=true;
    }
  });
  if(needLayout) layoutTracks();
  // Init any missing WS instances
  members.forEach(t=>{ if(!t.ws) initWS(t); });
  // Wait for all to be ready
  await Promise.all(members.map(t=>new Promise(res=>{
    if(t.ws && t.ws.getDuration()>0) return res();
    if(t.ws){ t.ws.once('ready',res); setTimeout(res,3500); }
    else res();
  })));
  // Snap all to time 0 then fire play in the same tick
  members.forEach(t=>{ if(t.ws) t.ws.seekTo(0); });
  members.forEach(t=>{ if(t.ws) t.ws.play().catch(()=>{}); });
  refreshGroupDisplay(g);
}

function groupStop(id){
  const g=gById(id); if(!g) return;
  g.trackIds.map(tById).filter(Boolean).forEach(t=>{
    clearAutoStop(t); clearInterval(t.fadeTimer);
    if(t.ws){ t.ws.stop(); t.ws.setVolume(effectiveVol(t)); }
    t.playing=false; t.loopPlays=0;
    refreshPlayUI(t);
  });
  updateStatus();
  refreshGroupDisplay(g);
}

// Snap all members' playback positions to the first member's current time
function groupResync(id){
  const g=gById(id); if(!g) return;
  const members=g.trackIds.map(tById).filter(t=>t?.ws);
  if(members.length<2){ showToast('Need ≥2 tracks with audio to sync'); return; }
  const leader=members[0];
  const leaderTime=leader.ws.getCurrentTime();
  members.slice(1).forEach(t=>{
    const dur=t.ws.getDuration()||1;
    t.ws.seekTo(Math.min(leaderTime,dur)/dur);
  });
  showToast(`Synced to "${leader.name}"`);
}

function setGroupVolume(id,v){
  const g=gById(id); if(!g) return;
  g.volume=parseFloat(v);
  // Re-apply effective volume on every member
  g.trackIds.map(tById).filter(Boolean).forEach(t=>{
    if(t.ws) t.ws.setVolume(effectiveVol(t));
  });
  const vp=g.el?.querySelector('[data-grole="vol-pct"]');
  if(vp) vp.textContent=Math.round(g.volume*100)+'%';
  autoSave();
}

// Time-based fade for an entire group's group-volume
function groupFade(id,dir){
  const g=gById(id); if(!g) return;
  clearInterval(g.fadeTimer);
  const FADE_MS=2000;
  const members=g.trackIds.map(tById).filter(t=>t?.ws);
  if(!members.length) return;
  let target, startVol;
  if(dir==='in'){
    // Fade group vol from 0 (or current if higher) up to 1 — but only update audio,
    // remember the saved group volume position
    target = g.volume<=0.01 ? 1 : g.volume;
    if(g.volume<=0.01){ g.volume=1; }
    startVol=0;
  } else {
    target=0;
    startVol=g.volume;
  }
  // We'll fade an internal multiplier without touching g.volume for fade-out
  // so the slider can return to it when fading back in.
  if(dir==='out'){
    // Save current as the "remembered" level; fade audio to 0 but keep slider position
    let cur=startVol;
    const t0=Date.now();
    g.fadeTimer=setInterval(()=>{
      const r=Math.min((Date.now()-t0)/FADE_MS,1);
      cur=startVol*(1-r);
      // Apply directly via setVolume on each member with cur as group multiplier
      members.forEach(t=>{
        if(t.ws) t.ws.setVolume(t.volume * cur * masterVol);
      });
      if(r>=1){
        clearInterval(g.fadeTimer);
        // Don't change g.volume — slider stays where user set it.
        // But silence is currently audible. We need a marker: when next Fade In happens,
        // it should start from 0 and fade up to g.volume. We track this with a __faded flag.
        g.__faded=true;
        members.forEach(t=>{ if(t.ws) t.ws.setVolume(0); });
      }
    },30);
    refreshGroupDisplay(g);
  } else {
    // Fade in: start audio from 0 → up to g.volume
    let cur=0;
    g.__faded=false;
    const t0=Date.now();
    g.fadeTimer=setInterval(()=>{
      const r=Math.min((Date.now()-t0)/FADE_MS,1);
      cur=g.volume*r;
      members.forEach(t=>{
        if(t.ws) t.ws.setVolume(t.volume * cur * masterVol);
      });
      if(r>=1){
        clearInterval(g.fadeTimer);
        // Restore proper effectiveVol on each
        members.forEach(t=>{ if(t.ws) t.ws.setVolume(effectiveVol(t)); });
      }
    },30);
    refreshGroupDisplay(g);
  }
}

// ────── Group DOM ──────
function buildGroupElement(g){
  const el=document.createElement('div');
  el.className='group-bar';
  el.id=`grp-${g.id}`;
  el.innerHTML=`
    <div class="grp-icon">⛬</div>
    <div class="grp-info">
      <div class="grp-name" ondblclick="renameGroup('${g.id}')" data-grole="name" title="Double-click to rename"></div>
      <div class="grp-meta" data-grole="meta"></div>
    </div>
    <button class="grp-play" data-grole="play" onclick="groupTogglePlay('${g.id}')" title="Play / pause all members in sync">▶</button>
    <button class="grp-stop" onclick="groupStop('${g.id}')" title="Stop all members">■</button>
    <div class="grp-vol-wrap">
      <span class="grp-vol-lbl">GRP</span>
      <input type="range" min="0" max="1" step="0.01" value="${g.volume}" data-grole="vol-slider" oninput="setGroupVolume('${g.id}',this.value)">
      <span class="grp-vol-pct" data-grole="vol-pct">${Math.round(g.volume*100)}%</span>
    </div>
    <button class="grp-fade" onclick="groupFade('${g.id}','in')" title="Fade in group">↑</button>
    <button class="grp-fade" onclick="groupFade('${g.id}','out')" title="Fade out group">↓</button>
    <button class="grp-fade" onclick="groupResync('${g.id}')" title="Re-sync all members to first track" style="font-size:13px">↻</button>
    <button class="grp-del" onclick="deleteGroup('${g.id}')" title="Delete group">✕</button>`;
  g.el=el;
  refreshGroupDisplay(g);
  return el;
}

function refreshGroupDisplay(g){
  if(!g.el) return;
  const nm=g.el.querySelector('[data-grole="name"]'); if(nm) nm.textContent=g.name;
  const members=g.trackIds.map(tById).filter(Boolean);
  const playing=members.filter(t=>t.playing).length;
  const meta=g.el.querySelector('[data-grole="meta"]');
  if(meta) meta.textContent=`${members.length} track${members.length!==1?'s':''}${playing>0?` · ${playing} playing`:''}`;
  const vp=g.el.querySelector('[data-grole="vol-pct"]'); if(vp) vp.textContent=Math.round(g.volume*100)+'%';
  const vs=g.el.querySelector('[data-grole="vol-slider"]'); if(vs && parseFloat(vs.value)!==g.volume) vs.value=g.volume;
  const pb=g.el.querySelector('[data-grole="play"]');
  if(pb){ pb.textContent=playing>0?'⏸':'▶'; pb.classList.toggle('on',playing>0); }
  g.el.classList.toggle('is-playing',playing>0);
}

// Update the small group badge on a track (shown when it's in a group)
function refreshTrackGroupBadge(t){
  if(!t.el) return;
  const g=groupOfTrack(t);
  const badgeC=t.el.querySelector('[data-role="grp-badge-c"]');
  const addC=t.el.querySelector('[data-role="grp-add-c"]');
  if(g){
    if(badgeC){
      badgeC.textContent=g.name.length>8?g.name.slice(0,8)+'…':g.name;
      badgeC.style.display='inline-flex';
      badgeC.title='In group: '+g.name+' (click to manage)';
    }
    if(addC) addC.style.display='none';
  } else {
    if(badgeC) badgeC.style.display='none';
    if(addC) addC.style.display='inline-flex';
  }
}

// Open group-assign popup for a track.
// We render the popup as a floating element on document.body so it escapes
// the track-item's overflow:hidden clipping.
let _activeGrpPopup=null;
function closeGroupPops(){
  if(_activeGrpPopup){ _activeGrpPopup.remove(); _activeGrpPopup=null; }
}
function toggleGroupPop(trackId, event){
  if(event) event.stopPropagation();
  const t=tById(trackId); if(!t) return;
  // If popup already open for this track, just close
  if(_activeGrpPopup && _activeGrpPopup.dataset.trackId==String(trackId)){
    closeGroupPops(); return;
  }
  closeGroupPops();
  // Find the trigger button position
  const trigger = t.el?.querySelector('[data-role="grp-add-c"]:not([style*="display:none"])')
    || t.el?.querySelector('[data-role="grp-badge-c"]:not([style*="display:none"])')
    || t.el?.querySelector('[data-role="grp-add-c"]')
    || t.el?.querySelector('[data-role="grp-badge-c"]');
  if(!trigger) return;
  const rect = trigger.getBoundingClientRect();

  // Build popup
  const pop=document.createElement('div');
  pop.className='grp-popup-floating';
  pop.dataset.trackId=trackId;
  const current=groupOfTrack(t);
  let html='';
  if(current){
    html+=`<div class="grp-pop-title">In: <strong style="color:var(--text)">${esc(current.name)}</strong></div>
           <button class="grp-pop-btn remove" onclick="removeTrackFromGroup(${t.id});closeGroupPops()">− Remove from group</button>`;
    const others=groups.filter(g=>g.id!==current.id);
    if(others.length){ html+='<div class="grp-pop-divider"></div><div class="grp-pop-title">Move to</div>'; }
    others.forEach(g=>{
      html+=`<button class="grp-pop-btn" onclick="addTrackToGroup(${t.id},'${g.id}');closeGroupPops()">${esc(g.name)} <span style="color:var(--muted);font-size:9px">(${g.trackIds.length})</span></button>`;
    });
  } else {
    html+='<div class="grp-pop-title">Add to group</div>';
    if(!groups.length){
      html+='<div style="font-size:10px;color:var(--muted);padding:4px 6px;font-style:italic">No groups yet</div>';
    }
    groups.forEach(g=>{
      html+=`<button class="grp-pop-btn" onclick="addTrackToGroup(${t.id},'${g.id}');closeGroupPops()">${esc(g.name)} <span style="color:var(--muted);font-size:9px">(${g.trackIds.length})</span></button>`;
    });
  }
  html+=`<div class="grp-pop-divider"></div><button class="grp-pop-btn new" onclick="createGroupFromTrack(${t.id});closeGroupPops()">+ New group…</button>`;
  pop.innerHTML=html;
  document.body.appendChild(pop);

  // Position it below the trigger, but flip up if it would go off the bottom
  const popH = pop.offsetHeight;
  const popW = pop.offsetWidth;
  let top = rect.bottom + 6;
  let left = rect.right - popW; // align right edge
  if(top + popH > window.innerHeight - 10) top = rect.top - popH - 6; // flip up
  if(left < 10) left = 10;
  if(left + popW > window.innerWidth - 10) left = window.innerWidth - popW - 10;
  pop.style.top = top+'px';
  pop.style.left = left+'px';
  _activeGrpPopup = pop;
}

// MASTER
// ════════════════════════════════════════════════
function setMaster(v){
  masterVol=parseFloat(v);
  const pct=Math.round(masterVol*100)+'%';
  const mv=document.getElementById('master-val'); if(mv) mv.textContent=pct;
  const sm=document.getElementById('st-master'); if(sm) sm.textContent=pct;
  tracks.forEach(t=>{if(t.ws)t.ws.setVolume(effectiveVol(t));});
  autoSave();
}

function nudgeMaster(delta){
  masterVol=Math.max(0,Math.min(1,masterVol+delta));
  const sl=document.getElementById('master-slider'); if(sl) sl.value=masterVol;
  setMaster(masterVol);
}

// ── Category volume (BGM / SFX / AMB) ──
function setCatVol(cat,v){
  clearInterval(catFadeTimer[cat]); // manual move cancels any running fade
  catVol[cat]=parseFloat(v);
  catLiveVol[cat]=catVol[cat]; // manual move sets the live level directly
  tracks.filter(t=>t.cat===cat).forEach(t=>{ if(t.ws) t.ws.setVolume(effectiveVol(t)); });
  const lbl=document.getElementById(`catvol-val-${cat}`);
  if(lbl) lbl.textContent=Math.round(catVol[cat]*100)+'%';
  const sl=document.getElementById(`catvol-slider-${cat}`);
  if(sl && parseFloat(sl.value)!==catVol[cat]) sl.value=catVol[cat];
  autoSave();
}
function nudgeCatVol(cat,delta){
  catVol[cat]=Math.max(0,Math.min(1,(catVol[cat]??1)+delta));
  setCatVol(cat,catVol[cat]);
}

// Fade an entire category — mirrors the track-card Fade In/Out behaviour:
//  • Fade In ramps the actual audio from its current live level UP to the fader's
//    set value over 2s, leaving the fader knob where it is. If the fader sits at 0,
//    it bumps to 100% first (same as the track version).
//  • Fade Out ramps the audio DOWN to silence over 2s, leaving the fader knob put,
//    so a later Fade In returns to that remembered level.
// We track the live audio level in catLiveVol[cat], separate from the stored catVol[cat].
function catFade(cat,dir){
  clearInterval(catFadeTimer[cat]);
  const FADE_MS=2000;
  // Where the audio currently sits (live). Initialise to the stored fader value.
  if(catLiveVol[cat]===undefined) catLiveVol[cat]=catVol[cat]??1;
  let target;
  if(dir==='in'){
    target = (catVol[cat]<=0.01) ? 1 : catVol[cat];
    if(catVol[cat]<=0.01){
      catVol[cat]=1;
      const sl=document.getElementById(`catvol-slider-${cat}`); if(sl) sl.value=1;
      const lbl=document.getElementById(`catvol-val-${cat}`); if(lbl) lbl.textContent='100%';
    }
  } else {
    target = 0;
  }
  const startLevel = catLiveVol[cat];
  if(Math.abs(startLevel-target)<0.005){
    catLiveVol[cat]=target;
    applyCatLive(cat);
    return;
  }
  const t0=Date.now();
  catFadeTimer[cat]=setInterval(()=>{
    const r=Math.min((Date.now()-t0)/FADE_MS,1);
    catLiveVol[cat]=startLevel+(target-startLevel)*r;
    applyCatLive(cat);
    if(r>=1){
      clearInterval(catFadeTimer[cat]);
      catLiveVol[cat]=target;
      applyCatLive(cat);
    }
  },30);
}

// Apply the live category multiplier (catLiveVol) to all tracks in that category,
// without disturbing the stored fader value.
function applyCatLive(cat){
  const prev=catVol[cat];
  catVol[cat]=catLiveVol[cat];
  tracks.filter(t=>t.cat===cat).forEach(t=>{ if(t.ws) t.ws.setVolume(effectiveVol(t)); });
  catVol[cat]=prev;
}

// FAVOURITES — one-shot instant sounds (fan, light switch, etc.)
// ════════════════════════════════════════════════
function mkFav(name,src,filename){ return {id:'f'+(++fid),name,src,filename}; }

function uploadFavourites(event){
  const files=Array.from(event.target.files); if(!files.length) return;
  files.forEach(f=>{
    favourites.push(mkFav(f.name.replace(/\.[^/.]+$/,''), URL.createObjectURL(f), f.name));
  });
  renderFavourites();
  showToast(`★ ${files.length} favourite${files.length>1?'s':''} added`);
  event.target.value='';
  autoSave();
}

function fireFavourite(fid_){
  const fav=favourites.find(f=>f.id===fid_); if(!fav||!fav.src){ showToast('No audio for this favourite — re-upload'); return; }
  const a=new Audio(fav.src);
  a.volume=0.5; // favourites always fire at 50%
  a.play().catch(()=>{});
  const btn=document.querySelector(`[data-fav="${fid_}"]`);
  if(btn){ btn.classList.add('fav-fired'); setTimeout(()=>btn.classList.remove('fav-fired'),300); }
}

function deleteFavourite(fid_){
  const fav=favourites.find(f=>f.id===fid_);
  if(fav?.src) URL.revokeObjectURL(fav.src);
  favourites=favourites.filter(f=>f.id!==fid_);
  renderFavourites();
  autoSave();
}

function renameFavourite(fid_){
  const fav=favourites.find(f=>f.id===fid_); if(!fav) return;
  const name=prompt('Rename favourite:',fav.name);
  if(name===null) return;
  fav.name=name.trim()||fav.name;
  renderFavourites();
  autoSave();
}

function renderFavourites(){
  const wrap=document.getElementById('fav-list'); if(!wrap) return;
  if(!favourites.length){
    wrap.innerHTML='<div class="fav-empty">No favourites yet. Upload short one-shots (fan, light switch, door…) for instant playback.</div>';
    return;
  }
  wrap.innerHTML=favourites.map(f=>`
    <div class="fav-chip${f.src?'':' fav-missing'}">
      <button class="fav-fire" data-fav="${f.id}" onclick="fireFavourite('${f.id}')" title="${f.src?'Tap to play':'No audio — re-upload'}">${esc(f.name)}</button>
      <button class="fav-edit" onclick="renameFavourite('${f.id}')" title="Rename">✎</button>
      <button class="fav-del" onclick="deleteFavourite('${f.id}')" title="Delete">✕</button>
    </div>`).join('');
}

// ════════════════════════════════════════════════
// FLOATING CONTROL WINDOW
// ════════════════════════════════════════════════
function toggleFloatingWindow(){
  const w=document.getElementById('float-window');
  if(w) w.classList.toggle('hidden');
}
function makeFloatingDraggable(){
  const w=document.getElementById('float-window');
  const handle=document.getElementById('float-handle');
  if(!w||!handle) return;
  let dragging=false, offX=0, offY=0, curX=0, curY=0, raf=null;

  // Track current position in px (left/top), seeded from its rendered spot
  const initPos=()=>{
    const r=w.getBoundingClientRect();
    curX=r.left; curY=r.top;
    w.style.left=curX+'px'; w.style.top=curY+'px';
    w.style.right='auto'; w.style.bottom='auto';
  };

  const start=(x,y)=>{
    if(!w.style.left) initPos();
    dragging=true;
    const r=w.getBoundingClientRect();
    offX=x-r.left; offY=y-r.top;
    w.style.transition='none';
    w.classList.add('dragging');
  };
  const apply=()=>{
    raf=null;
    w.style.left=curX+'px';
    w.style.top=curY+'px';
  };
  const move=(x,y)=>{
    if(!dragging) return;
    let nx=x-offX, ny=y-offY;
    nx=Math.max(4,Math.min(window.innerWidth-w.offsetWidth-4,nx));
    ny=Math.max(4,Math.min(window.innerHeight-w.offsetHeight-4,ny));
    curX=nx; curY=ny;
    if(!raf) raf=requestAnimationFrame(apply);
  };
  const end=()=>{ dragging=false; w.classList.remove('dragging'); };

  handle.addEventListener('mousedown',e=>{ start(e.clientX,e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  document.addEventListener('mouseup',end);

  // Touch: non-passive so we can preventDefault and stop the page scrolling under the drag
  handle.addEventListener('touchstart',e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
  document.addEventListener('touchmove',e=>{
    if(!dragging) return;
    const t=e.touches[0]; move(t.clientX,t.clientY);
    e.preventDefault(); // block page scroll while dragging the window
  },{passive:false});
  document.addEventListener('touchend',end);
  document.addEventListener('touchcancel',end);
}

// UPLOAD
// ════════════════════════════════════════════════
function guessCat(name){
  const n=name.toLowerCase();
  if(/music|bgm|theme|score|ost|song/.test(n)) return 'BGM';
  if(/sfx|effect|hit|click|beep|buzz|ding|whoosh|snap|shot|door|foot|crash|bang/.test(n)) return 'SFX';
  return 'AMB';
}

// Smart upload: if a file's name matches a track that's missing its audio source,
// attach it to that track rather than making a duplicate. Otherwise add as new.
function uploadMulti(event){
  const files=Array.from(event.target.files); if(!files.length) return;
  let matched=0, added=0, favRestored=0;
  files.forEach(f=>{
    // First: does this file match a favourite missing its audio?
    const orphanFav=favourites.find(fav=>!fav.src && fav.filename===f.name);
    if(orphanFav){
      orphanFav.src=URL.createObjectURL(f);
      favRestored++;
      return;
    }
    // Look for an empty track with the same filename
    const orphan=tracks.find(t=>!t.src && t.filename===f.name);
    if(orphan){
      orphan.src=URL.createObjectURL(f);
      if(orphan.ws){ orphan.ws.destroy(); orphan.ws=null; orphan._rp=null; orphan.region=null; }
      if(isTrackExpanded(orphan)) initWS(orphan);
      refreshTrackDisplay(orphan);
      matched++;
    } else {
      const cat=guessCat(f.name);
      const t=mkTrack(f.name.replace(/\.[^/.]+$/,''),cat);
      t.src=URL.createObjectURL(f);
      t.filename=f.name;
      tracks.push(t);
      buildTrackElement(t);
      added++;
    }
  });
  if(favRestored) renderFavourites();
  layoutTracks();
  const bits=[];
  if(added) bits.push(`${added} new`);
  if(matched) bits.push(`${matched} restored`);
  if(favRestored) bits.push(`${favRestored} fav`);
  showToast('↑ '+(bits.length?bits.join(', '):'nothing added'));
  event.target.value='';
  autoSave();
}

function uploadSingle(event,id){
  const f=event.target.files[0]; if(!f) return;
  const t=tById(id); if(!t) return;
  if(t.src) URL.revokeObjectURL(t.src);
  if(t.ws){ t.ws.destroy(); t.ws=null; t._rp=null; t.region=null; }
  t.src=URL.createObjectURL(f);
  t.filename=f.name;
  t.name=f.name.replace(/\.[^/.]+$/,'');
  t.playing=false; t.loopStart=null; t.loopEnd=null;
  // Refresh display fields on the existing element
  refreshTrackDisplay(t);
  // If expanded, recreate WaveSurfer for the new audio
  if(isTrackExpanded(t)) initWS(t);
  autoSave();
}

function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),2200);
}
